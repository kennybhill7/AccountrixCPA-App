deck: Complete Construction CFO Course
cards:
  - q: >-
      What does this mean: "# **Construction CFO Training Flashcards - Months
      ..."?
    a: >-
      **A:** 1) Project-based revenue recognition, 2) Long-term contract
      complexity, 3) Unique cost structure (direct/indirect/joint costs), 4)
      Cash flow timing issues **Explanation:** These factors create challenges
      that don't exist in traditional retail or service businesses
  - q: >-
      What does this mean: "**Q2:** What is the five-step ASC 606 revenue
      reco..."?
    a: >-
      **A:** 1) Identify contract with customer, 2) Identify performance
      obligations, 3) Determine transaction price, 4) Allocate transaction price
      to performance obligations, 5) Recognize revenue when performance
      obligations are satisfied **Explanation:** This framework replaced
      industry-specific guidance and applies to all construction contracts
  - q: >-
      What does this mean: "**Q3:** How do construction companies typically
      ha..."?
    a: >-
      **A:** Customers withhold 5-10% of each payment until project completion,
      creating both retainage receivable (asset) and retainage payable
      (liability to subcontractors) **Explanation:** This creates working
      capital challenges as companies must finance the difference between what
      they hold and what is held from them
  - q: >-
      What does this mean: "### **Lesson 2: Mastering Revenue Recognition
      Unde..."?
    a: >-
      **A:** When either: 1) Customer controls the asset as it's created (work
      on customer's land), OR 2) Entity creates asset with no alternative use
      and has right to payment for work completed **Explanation:** Most
      construction contracts qualify for over-time recognition, eliminating the
      completed contract method
  - q: >-
      What does this mean: "**Q5:** What is the formula for
      percentage-of-comp..."?
    a: >-
      **A:** Revenue Recognition = (Costs Incurred ÷ Total Expected Costs) ×
      Transaction Price **Explanation:** This input method is most common
      because costs typically correlate well with progress completion
  - q: >-
      What does this mean: "# **Construction CFO Training Flashcards - Months
      ..."?
    a: >-
      A) Project Integration, Multi-Dimensional Flexibility, Scalability B)
      Simplicity, Cost Control, Revenue Recognition C) Cash Management, Risk
      Control, Tax Optimization D) Equipment Tracking, Labor Allocation,
      Material Control


      **Answer:** A) Project Integration, Multi-Dimensional Flexibility,
      Scalability **Explanation:** Construction charts of accounts must
      integrate with job costing, support multi-dimensional tracking (entity,
      project, cost code, phase), and scale with business growth
  - q: >-
      What does this mean: "**Q2:** The account "Costs in Excess of Billings"
      ..."?
    a: '**Q3:** When should retainage receivable be classified as long-term'
  - q: >-
      What does this mean: "A) Always classified as current asset B) When due
      ..."?
    a: >-
      **Q4:** Calculate WIP position: Contract $850,000, Costs incurred
      $425,000, Gross profit recognized $106,250, Progress billings $475,000 A)
      $56,250 asset B) $43,750 liability C) $106,250 asset D) $50,000 liability


      **Answer:** A) $56,250 asset **Explanation:** WIP = (Costs + Profit) -
      Billings = ($425,000 + $106,250) - $475,000 = $56,250 asset (Costs in
      Excess of Billings)


      **Q5:** Equipment depreciation in construction should be: A) Always
      expensed as overhead B) Allocated to projects as direct cost when used for
      construction C) Never allocated to specific projects D) Only recorded when
      equipment is sold


      **Answer:** B) Allocated to projects as direct cost when used for
      construction **Explanation:** Construction equipment depreciation should
      be allocated to projects based on usage to ensure accurate job costing and
      project profitability
  - q: >-
      What does this mean: "**Q6:** The three-way match process includes: A)
      P..."?
    a: >-
      **Q7:** Which segregation of duties violation creates the highest fraud
      risk
  - q: >-
      What does this mean: "A) Same person prepares and signs checks B) Same
      p..."?
    a: >-
      **Q8:** Monthly closing for construction companies is more complex because
      of: A) Higher transaction volumes only B) Multiple projects, complex WIP
      calculations, project-based allocations C) More bank accounts than other
      industries D) Seasonal revenue fluctuations


      **Answer:** B) Multiple projects, complex WIP calculations, project-based
      allocations **Explanation:** Construction closes require project-level
      analysis, WIP calculations requiring PM input, and complex cost
      allocations across multiple projects
  - q: >-
      Q100: What are the essential elements of construction contract risk
      management? A: Contract review and approval process, change order
      controls, lien waiver management, insurance requirement verification,
      payment terms optimization, dispute resolution procedures
    a: >-
