solution_approach: |
  STEP-BY-STEP SOLUTION:

  1. FEBRUARY DIFFERENCE ANALYSIS
     - Bank statement balance 2/28: $487,325
     - GL balance 2/28: $499,775
     - Difference: $12,450 (GL overstated)
     - Root cause: Duplicate check #2874 for $3,250 + transposition error $900 +
       stale checks never written off $8,920 + bank error $2,100 (will reverse) = explains difference

  2. STALE CHECKS (Write off to Unclaimed Property)
     Check #     Date        Amount
     1847        10/15/24    $1,200
     1923        10/28/24    $850
     1956        11/02/24    $2,100
     1982        11/10/24    $1,450
     2014        11/15/24    $950
     2033        11/20/24    $1,370
     2048        11/25/24    $1,000
     TOTAL: $8,920

  3. CLEARED DEPOSITS IN TRANSIT
     All 3 February DIT cleared in first week of March:
     - $15,000 (cleared 3/1)
     - $22,500 (cleared 3/2)
     - $7,500 (cleared 3/4)
     TOTAL: $45,000

  4. BOOK ERRORS FOUND
     a) Duplicate check #2874 recorded twice: $3,250 (need to add back once)
     b) Deposit $16,200 recorded as $15,300: $900 short (need to add $900)
     c) Check #3102 recorded as $5,400 but actually $4,500: $900 over (need to add $900)
     TOTAL NET ADJUSTMENT: +$5,050

  5. BANK ERRORS FOUND
     - Check #2947 for $2,100 charged to our account but belongs to another company
       (Bank will reverse - add to bank side only)

  6. MARCH 31 BANK RECONCILIATION

     BANK SIDE:
     Balance per bank statement, 3/31              $515,225
     Add: Deposits in transit (3/29-3/31)         +$12,500
     Less: Outstanding checks (see schedule)       -$6,150
     Add: Bank error (check charged wrong acct)   +$2,100
     ADJUSTED BANK BALANCE                         $523,675

     BOOK SIDE:
     Balance per GL, 3/31                          $508,550
     Add: Note collected by bank                   +$10,000
     Add: Duplicate check #2874 correction         +$3,250
     Add: Deposit understatement correction        +$900
     Add: Check overstatement correction           +$900
     Less: NSF check                               -$850
     Less: Bank service charges                    -$75
     ADJUSTED BOOK BALANCE                         $523,675

     ✓ RECONCILED!

  7. ADJUSTING JOURNAL ENTRIES

     Entry 1: Record note collection
     3/31/25
       Dr. Cash - Operating (1022)                 $10,000
           Cr. Notes Receivable                              $10,000
       To record note collected by bank

     Entry 2: Correct duplicate check entry
     3/31/25
       Dr. Cash - Operating (1022)                 $3,250
           Cr. Accounts Payable                              $3,250
       To remove duplicate recording of check #2874

     Entry 3: Correct deposit understatement
     3/31/25
       Dr. Cash - Operating (1022)                 $900
           Cr. Accounts Receivable                           $900
       To correct deposit recorded at $15,300, actual $16,200

     Entry 4: Correct check overstatement
     3/31/25
       Dr. Cash - Operating (1022)                 $900
           Cr. Accounts Payable                              $900
       To correct check #3102 recorded at $5,400, actual $4,500

     Entry 5: Record NSF check
     3/31/25
       Dr. Accounts Receivable                     $850
           Cr. Cash - Operating (1022)                       $850
       To record NSF check from customer

     Entry 6: Record bank charges
     3/31/25
       Dr. Bank Charges Expense                    $75
           Cr. Cash - Operating (1022)                       $75
       To record March bank service charges

     TOTAL DEBITS: $16,200  |  TOTAL CREDITS: $16,200  ✓

  8. CFO MEMO TALKING POINTS
     - February difference caused by: lack of timely review (stale checks), data entry errors (duplicate/transposition), no reconciliation for 90+ days
     - Prevention: Weekly sub-reconciliations, dual review of entries >$1,000, automate check clearing tracking
     - Process improvements: Implement 3-way match (PO-Receipt-Check), automated bank feed import, monthly close checklist with reconciliation sign-off

cfo_tips: |
  REAL CFO INSIGHTS (from your actual experience):

  1. BEGINNING BALANCE ISSUES (Your Account 1022 problem)
     - Never close a month with unreconciled differences
     - If you inherit a mess: Create a "reconciliation catch-up" schedule
     - Document the resolution in a memo for auditors

  2. STALE CHECK POLICY
     - Most states require escheatment (unclaimed property) after 1-2 years
     - Best practice: Write off checks >90 days to a liability account
     - Contact vendor first; if no response, reclassify

  3. DAILY CASH MONITORING
     - Check bank balance every morning before 10am
     - Flag large unexpected transactions immediately
     - Set up bank alerts for transactions >$10,000

  4. AUTOMATION OPPORTUNITIES
     - Bank feed integration (daily import to GL)
     - Check clearing dashboard (outstanding check aging)
     - Auto-match rules for recurring items (payroll, utilities)

  5. MONTH-END CLOSE DEPENDENCIES
     - Bank rec MUST be done before close - it affects cash, AP, AR
     - If rec doesn't balance, trace back 2-3 months to find where it broke
     - Your 2023-not-closed issue? Probably started with a bad rec.

  6. AUDITOR EXPECTATIONS
     - Expect them to select 5-10 outstanding checks and trace to subsequent clearance
     - They'll test cutoff: last 5 days of month and first 5 days of next month
     - Have all bank statements, GL detail, and reconciliations ready in one folder

