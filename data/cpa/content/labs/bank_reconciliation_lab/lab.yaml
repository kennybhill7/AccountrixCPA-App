---
lab_id: LAB-001-BANK-REC
title: "Bank Reconciliation Master Class"
section: FAR
difficulty: Medium
estimated_time_minutes: 90
cfo_skill: "Monthly Bank Reconciliation"
real_world_context: |
  Based on CFO's actual work: Reconciling 2,930 transactions across Account 1022
  with recurring beginning balance issues and unexplained differences.

learning_objectives:
  - Identify and classify reconciling items (deposits in transit, outstanding checks, bank errors, book errors)
  - Trace beginning balance discrepancies to prior period issues
  - Prepare bank reconciliation with proper adjustments
  - Record correcting journal entries for book errors
  - Master the T-account approach to reconciliation forensics

scenario: |
  You are the CFO of Example Development Corp. It's March 31, 2025, and you're performing
  the monthly bank reconciliation for the operating account (GL Account 1022).

  The prior month (February) was closed with an unresolved $12,450 difference that was
  never corrected. You suspect there are outstanding checks from 4+ months ago that should
  be written off, deposits in transit that cleared but weren't recorded, and possible
  duplicate check entries.

  Your task: Prepare a complete bank reconciliation, identify all errors, and fix them.

datasets:
  - file: "bank_statement_march_2025.csv"
    description: "March bank statement with 347 transactions"
  - file: "gl_account_1022_march.csv"
    description: "General ledger detail for Account 1022"
  - file: "outstanding_checks_feb.csv"
    description: "Outstanding checks from February reconciliation"
  - file: "deposits_in_transit_feb.csv"
    description: "Deposits in transit from February"

tasks:
  - task_id: 1
    description: "Calculate the February 28 unreconciled difference"
    instructions: |
      Compare the Feb 28 bank statement balance ($487,325) with GL balance ($499,775).
      Identify the $12,450 difference and trace to specific items.
    deliverable: "feb_unreconciled_analysis.csv"
    points: 10

  - task_id: 2
    description: "Identify stale outstanding checks (90+ days old)"
    instructions: |
      Review outstanding_checks_feb.csv. Any check dated before December 1, 2024
      should be written off (reclassified to Unclaimed Property liability).
    deliverable: "stale_checks_writeoff.csv"
    points: 15

  - task_id: 3
    description: "Identify deposits in transit that cleared"
    instructions: |
      Compare deposits_in_transit_feb.csv with March bank statement.
      Any deposit in transit that cleared should be removed from reconciling items.
    deliverable: "cleared_deposits.csv"
    points: 10

  - task_id: 4
    description: "Find book errors (duplicate checks, transposition errors)"
    instructions: |
      Compare GL entries with bank statement. Look for:
      - Same check number recorded twice
      - Amounts transposed (e.g., $1,234 vs $1,324)
      - Deposits recorded at wrong amount
    deliverable: "book_errors.csv"
    points: 20

  - task_id: 5
    description: "Find bank errors"
    instructions: |
      Review bank statement for errors:
      - Checks charged to wrong account
      - Incorrect amounts
      - Duplicate charges
      (Bank errors do NOT require journal entries - bank will correct)
    deliverable: "bank_errors.csv"
    points: 10

  - task_id: 6
    description: "Prepare March 31 bank reconciliation"
    instructions: |
      Standard format:
        Bank balance, March 31:            $XXX,XXX
        Add: Deposits in transit           +$XX,XXX
        Less: Outstanding checks           -$XX,XXX
        Add/Less: Bank errors              ±$X,XXX
        Adjusted bank balance:             $XXX,XXX

        Book balance, March 31:            $XXX,XXX
        Add: Collections by bank           +$X,XXX
        Less: NSF checks                   -$X,XXX
        Less: Bank charges                 -$XXX
        Add/Less: Book errors              ±$X,XXX
        Adjusted book balance:             $XXX,XXX

        MUST AGREE: Adjusted bank = Adjusted book
    deliverable: "bank_rec_march_31.xlsx"
    points: 25

  - task_id: 7
    description: "Prepare adjusting journal entries"
    instructions: |
      Record JEs for all book-side reconciling items:
      - Collections
      - NSF checks
      - Bank charges
      - Book errors
      - Stale check write-offs

      Format:
        Date | Account | Debit | Credit | Explanation
    deliverable: "adjusting_entries.csv"
    points: 20

  - task_id: 8
    description: "CFO Memo: Root cause analysis"
    instructions: |
      Write a 1-page memo explaining:
      1. What caused the February unreconciled difference?
      2. How can we prevent this next month?
      3. Process improvements needed
    deliverable: "cfo_memo.txt"
    points: 10

