id: AUD-MCQ-RISK-0167
section: AUD
type: MCQ
difficulty: Easy
blueprint_area: Risk Assessment
topic: Risk Assessment
skills: ["audit-risk-model"]
learning_obj: Apply Risk Assessment concepts
stem: Company operates in a high-risk jurisdiction with high corruption index and
  weak controls. What is inherent risk?
options:
- text: Medium - fraud is rare in this industry
  key: false
- text: Low - can be mitigated by substantive procedures
  key: false
- text: Depends on prior year results
  key: false
- text: High - operating environment and weak controls increase risk
  key: true
explanation: AU-C 315 requires assessment of inherent risk before considering controls.
  Corrupt environment increases inherent risk independent of controls.
refs:
- AU-C 315.11
- AU-C 315.A42
