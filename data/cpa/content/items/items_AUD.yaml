id: AUD-MCQ-ETHI-0001
section: AUD
type: MCQ
difficulty: Easy
blueprint_area: Ethics
topic: Ethics
skills: ["professional-ethics"]
learning_obj: Apply Ethics concepts
stem: CPA firm provides IT system selection services to an audit client. Is independence
  impaired?
options:
- text: No, if pre-approved by audit committee
  key: false
- text: No, if fee is less than 10% of total fees
  key: false
- text: Yes, management decision-making impairs independence
  key: true
- text: Only impaired for public companies
  key: false
explanation: ET 1.295 prohibits services where CPA makes management decisions for
  audit clients. This creates self-review threat.
refs:
- ET 1.295.030
- ET 1.295.040
---
id: AUD-MCQ-ETHI-0002
section: AUD
type: MCQ
difficulty: Easy
blueprint_area: Ethics
topic: Ethics
skills: ["professional-ethics"]
learning_obj: Apply Ethics concepts
stem: An auditor discovered that the client's CFO owns 10% of the auditing firm. Which
  independence rule is violated?
options:
- text: No violation - ownership under 50%
  key: false
- text: Direct financial interest - independence is impaired
  key: true
- text: Indirect financial interest - independence not impaired if immaterial
  key: false
- text: Contingent fee arrangement violation
  key: false
explanation: AICPA Code 1.200.001 prohibits direct financial interests regardless
  of materiality. CFO ownership in audit firm creates impermissible direct interest.
refs:
- ET 1.200.001
- ET 1.110.010
---
