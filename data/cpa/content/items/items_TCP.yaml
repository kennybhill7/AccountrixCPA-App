id: TCP-MCQ-DEDC-0018
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Credits vs. Deductions
stem: >-
  A taxpayer in the 24% marginal bracket may claim either a $1,000 tax credit or a $1,000 deduction
  (not both). How much MORE tax does the credit save than the deduction?
options:
  - text: $0 — they are equivalent
    key: false
  - text: $240
    key: false
  - text: $760
    key: true
  - text: $1,000
    key: false
explanation: >-
  A credit reduces tax dollar-for-dollar ($1,000 saved); a deduction reduces taxable income, saving
  rate × amount = 24% × $1,000 = $240. Difference = $1,000 − $240 = $760. (A) encodes the
  misconception that credits and deductions are interchangeable. (B) is the value of the DEDUCTION,
  not the difference. (D) is the value of the CREDIT alone, ignoring that the deduction also saves
  something.
refs:
  - Tax formula fundamentals
  - TCP U1-W2
