id: TCP-MCQ-ENTP-0045
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Compliance
topic: S Corporation Basis Ordering
stem: >-
  An S corporation shareholder begins the year with $30,000 stock basis. During the year her K-1
  shows: ordinary income $20,000, tax-exempt interest $5,000, a $40,000 cash distribution, and a
  $20,000 ordinary loss. Applying the basis-ordering rules (income first, then distributions, then
  losses), how much loss may she deduct this year?
options:
  - text: $20,000
    key: false
  - text: $0
    key: false
  - text: $15,000, with $5,000 suspended and carried forward
    key: true
  - text: $10,000
    key: false
explanation: >-
  Ordering: basis $30,000 + $20,000 income + $5,000 tax-exempt = $55,000; distribution $40,000
  (nontaxable — within basis) reduces basis to $15,000; the $20,000 loss is then limited to the
  $15,000 remaining basis, with $5,000 suspended until basis is restored. (A) ignores the basis
  limitation. (B) assumes the distribution wipes out all loss capacity. (D) forgets that tax-exempt
  income ALSO increases basis ($30,000 + $20,000 − $40,000 = $10,000) — omitting the $5,000
  exempt-interest step.
refs:
  - IRC §1366(d), §1367, §1368
  - TCP U2-W2
