id: TCP-MCQ-INDV-0006
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Hobby Income
stem: >-
  In 2026 a controller's weekend woodworking activity — properly classified as a hobby (no profit
  motive) — generates $8,000 of receipts and $5,000 of supplies expense. What is the effect on
  taxable income?
options:
  - text: Increase of $3,000 — hobby expenses offset hobby income
    key: false
  - text: No effect — hobby income is not taxable
    key: false
  - text: >-
      Increase of $8,000 — the receipts are gross income, and the expenses are nondeductible because
      miscellaneous itemized deductions are permanently terminated
    key: true
  - text: >-
      Increase of $8,000 of income with a $5,000 miscellaneous itemized deduction subject to the 2%
      floor
    key: false
explanation: >-
  Hobby receipts are gross income under §61, but hobby expenses were deductible (if at all) only as
  miscellaneous 2%-of-AGI itemized deductions — a category PERMANENTLY terminated (P.L. 119-21
  §70110). Net effect: +$8,000. (A) encodes the misconception that hobbies are taxed on net profit
  like a business. (B) confuses 'no profit motive' with 'no taxable income.' (D) applies the
  pre-termination 2% misc regime, which no longer exists in 2026.
refs:
  - IRC §183; §61
  - P.L. 119-21 §70110
  - TCP U1-W1
