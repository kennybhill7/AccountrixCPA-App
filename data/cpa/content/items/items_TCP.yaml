id: TCP-MCQ-PROP-0038
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Property Transactions (Disposition of Assets)
topic: Like-Kind Exchange — Recognized Gain
stem: >-
  An investor exchanges business real estate (adjusted basis $280,000) for like-kind real estate
  worth $350,000 plus $50,000 cash. Compute the recognized gain.
options:
  - text: $50,000 — the lesser of realized gain ($120,000) or boot received ($50,000)
    key: true
  - text: $120,000
    key: false
  - text: $0 — like-kind exchanges are fully tax-deferred
    key: false
  - text: $70,000
    key: false
explanation: >-
  Amount realized = $350,000 + $50,000 = $400,000; realized gain = $400,000 − $280,000 = $120,000.
  §1031 recognition = LESSER of realized gain or boot = $50,000. (B) recognizes the full realized
  gain, ignoring §1031 deferral. (C) ignores the boot — deferral is total only in a pure
  property-for-property swap. (D) reports the DEFERRED portion ($120,000 − $50,000) as recognized,
  inverting the split.
refs:
  - IRC §1031(b)
  - TCP U2-W1
