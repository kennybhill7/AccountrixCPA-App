id: TCP-MCQ-PFPL-0055
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Early Retirement Distributions
stem: >-
  A 45-year-old in the 24% bracket withdraws $20,000 from his traditional IRA (all pre-tax) to buy a
  boat — no exception applies. Compute the total federal cost of the withdrawal.
options:
  - text: $4,800
    key: false
  - text: $2,000
    key: false
  - text: $0 — IRA withdrawals are a tax-free return of the owner's own money
    key: false
  - text: $6,800 — $4,800 income tax plus a $2,000 early-distribution penalty
    key: true
explanation: >-
  The distribution is ordinary income (24% × $20,000 = $4,800) PLUS the §72(t) 10% additional tax
  ($2,000) because he is under 59½ with no exception (no first home, education, disability, etc.):
  total $6,800 — a 34% haircut that makes early withdrawals a last resort. (A) forgets the penalty.
  (B) counts only the penalty. (C) confuses pre-tax traditional IRA dollars with Roth basis —
  nothing here was previously taxed.
refs:
  - IRC §72(t)
  - TCP U2-W3
