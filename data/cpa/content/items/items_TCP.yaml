id: TCP-MCQ-ENTC-0029
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Planning
topic: S Corporation Employment-Tax Planning
stem: >-
  A profitable services business earns $150,000 per year. As a sole proprietorship, assume all of it
  faces 15.3% self-employment tax. As an S corporation paying its owner a reasonable $90,000 salary
  with the remaining $60,000 distributed, only the salary faces the 15.3% employment tax. Estimate
  the annual employment-tax savings from the S corporation structure.
options:
  - text: $0 — distributions are also subject to self-employment tax
    key: false
  - text: $22,950
    key: false
  - text: $9,180
    key: true
  - text: $13,770
    key: false
explanation: >-
  Savings = 15.3% × the $60,000 shifted from salary/SE income to distributions = $9,180. S
  corporation distributions to a shareholder-employee are not self-employment income (unlike a sole
  proprietor's entire net earnings), which is the core of this strategy — subject to the
  reasonable-compensation requirement. (A) states the sole-proprietorship rule as if it applied to S
  corp distributions. (B) is 15.3% × $150,000 — the total tax as a proprietor, not the SAVINGS. (D)
  is 15.3% × $90,000 — the tax still paid on the salary, not the savings.
refs:
  - IRC §1402; §3121; Rev. Rul. 74-44
  - TCP U1-W4
  - TCP U2-W2
