id: TCP-MCQ-PROP-0037
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Property Transactions (Disposition of Assets)
topic: Capital Loss Limitation
stem: >-
  In 2026 an individual has an $8,000 net long-term capital loss and no capital gains. How is it
  used?
options:
  - text: Deduct all $8,000 against ordinary income this year
    key: false
  - text: Deduct $3,000 this year; the remaining $5,000 is lost
    key: false
  - text: >-
      Deduct $3,000 against ordinary income this year; carry the remaining $5,000 forward
      indefinitely
    key: true
  - text: Deduct $0 — capital losses offset only capital gains
    key: false
explanation: >-
  Individuals net capital losses against gains, then deduct up to $3,000 (MFJ; $1,500 MFS) against
  ordinary income, carrying the excess forward indefinitely with its character preserved: $3,000
  now, $5,000 carryover. (A) ignores the $3,000 annual limit. (B) forgets the indefinite
  carryforward. (D) states the CORPORATE rule — corporations get no ordinary-income offset (and only
  a 3-back/5-forward carry), individuals do.
refs:
  - IRC §1211(b), §1212(b)
  - TCP U2-W1
