id: TCP-MCQ-PFPL-0056
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: 529 Education Plans
stem: Which statement correctly describes the federal tax treatment of a §529 education savings plan?
options:
  - text: Contributions are deductible on the federal return
    key: false
  - text: Earnings grow tax-deferred and are tax-FREE when withdrawn for qualified education expenses
    key: true
  - text: Earnings are always taxable when withdrawn, regardless of use
    key: false
  - text: Only tuition at in-state public universities qualifies
    key: false
explanation: >-
  The federal benefit is on the back end: no deduction going in, but earnings escape tax entirely
  when distributions pay qualified education expenses. Contributions are also completed gifts
  eligible for the annual exclusion (with a 5-year front-loading election). (A) confuses the
  occasional STATE deduction with federal law — there is no federal deduction. (C) describes
  nonqualified withdrawals only (earnings portion taxed plus 10% penalty). (D) invents a
  residency/institution restriction — eligible institutions nationwide (and certain K-12 and
  apprenticeship costs) qualify.
refs:
  - IRC §529
  - TCP U2-W3
  - TCP U1-W3
