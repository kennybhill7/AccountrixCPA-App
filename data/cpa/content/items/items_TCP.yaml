id: TCP-MCQ-PROP-0044
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Property Transactions (Disposition of Assets)
topic: Wash Sales
stem: >-
  An investor sells 100 shares at a $4,000 loss on December 20 and repurchases 100 identical shares
  for $12,000 on January 8 — 19 days later. What is the result?
options:
  - text: The $4,000 loss is deductible, and the new shares take a $12,000 basis
    key: false
  - text: >-
      The loss is disallowed under the wash-sale rule, and the new shares take a $16,000 basis
      ($12,000 cost + $4,000 disallowed loss)
    key: true
  - text: The loss is disallowed permanently, and the new shares take a $12,000 basis
    key: false
  - text: Only $3,000 of the loss is deductible this year
    key: false
explanation: >-
  Repurchasing substantially identical securities within 30 days before or after a loss sale
  triggers §1091: the loss is disallowed but PRESERVED by adding it to the replacement shares' basis
  ($16,000), and the holding period tacks. (A) ignores the wash-sale window (19 days < 30). (C)
  treats the disallowance as permanent — the basis addback defers, not destroys, the loss. (D)
  confuses the wash-sale rule with the $3,000 annual capital-loss limit, which never comes into play
  because no loss is currently allowed.
refs:
  - IRC §1091
  - TCP U2-W1
