id: TCP-MCQ-DEDC-0014
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: QBI — SSTB Phase-Out
stem: >-
  A consulting practice (a specified service trade or business) generates QBI of $300,000 and pays
  W-2 wages of $150,000. The owner's 2026 taxable income is $900,000 — far above the top of the SSTB
  phase-out range. What is her QBI deduction?
options:
  - text: $60,000 — 20% of QBI
    key: false
  - text: $75,000 — 50% of W-2 wages
    key: false
  - text: $0 — SSTB income earns no QBI deduction once taxable income exceeds the full phase-out ceiling
    key: true
  - text: $37,500 — 25% of W-2 wages
    key: false
explanation: >-
  For an SSTB, once taxable income exceeds the top of the phase-out range the deduction is
  completely eliminated — no amount of W-2 wages rescues it. Answer: $0. (A) treats the business as
  a non-SSTB below the threshold. (B) applies the wage limit, which only matters for QUALIFIED
  businesses (or within the phase-out band) — above the ceiling, SSTB status zeroes everything
  first. (D) applies a fragment of the alternative wage/UBIA test to a situation where no deduction
  exists at all.
refs:
  - IRC §199A(d)
  - TCP U1-W2
