id: TCP-MCQ-GIFT-0024
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Estate Tax Computation
stem: >-
  A decedent dying in 2026 leaves a taxable estate of $19,000,000, made no prior taxable gifts, and
  the basic exclusion is $15,000,000. Assuming a flat 40% rate on the excess, compute the estate
  tax.
options:
  - text: $7,600,000
    key: false
  - text: $1,600,000
    key: true
  - text: $0
    key: false
  - text: $760,000
    key: false
explanation: >-
  Tax = 40% × ($19,000,000 − $15,000,000) = 40% × $4,000,000 = $1,600,000 (the ~$15M P.L. 119-21
  exemption absorbs the rest via the unified credit). (A) taxes the entire estate with no exemption.
  (C) encodes the misconception that the exemption is $30M for every estate — $30M applies only to a
  married COUPLE combining two exemptions (e.g., via portability). (D) is a decimal slip: 40% ×
  $1.9M instead of $4.0M.
refs:
  - IRC §2001, §2010
  - TCP U1-W3
