id: TCP-MCQ-PROC-0060
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Estimated Tax Safe Harbor
stem: >-
  A taxpayer's prior-year AGI was $310,000 and prior-year tax was $40,000. This year's income will
  be dramatically higher and hard to estimate. To be penalty-proof using the prior-year safe harbor,
  his withholding plus timely estimates must total at least:
options:
  - text: $40,000
    key: false
  - text: $44,000 — 110% of prior-year tax, because prior-year AGI exceeded $150,000
    key: true
  - text: $36,000
    key: false
  - text: $50,000
    key: false
explanation: >-
  Individuals avoid the §6654 penalty by paying the lesser of 90% of the current-year tax or 100% of
  prior-year tax — bumped to 110% of prior-year tax when prior-year AGI exceeds $150,000. Since
  current-year tax is high and uncertain, the reliable target is 110% × $40,000 = $44,000. (A) uses
  the 100% safe harbor available only to lower-AGI taxpayers. (C) applies 90% to the PRIOR year's
  tax — the 90% test applies to the CURRENT year's tax. (D) invents a 125% requirement that does not
  exist.
refs:
  - IRC §6654(d)
  - TCP U2-W4
