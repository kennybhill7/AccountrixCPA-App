id: TCP-MCQ-ENTP-0051
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Entity Tax Planning
topic: Sale of Partnership Interest — Hot Assets
stem: >-
  A partner sells his partnership interest for a total gain of $100,000. His share of the
  partnership's unrealized receivables (a §751 'hot asset') is $30,000. How is the gain
  characterized?
options:
  - text: $100,000 capital gain — a partnership interest is a capital asset
    key: false
  - text: $100,000 ordinary income
    key: false
  - text: $70,000 ordinary income and $30,000 capital gain
    key: false
  - text: $30,000 ordinary income and $70,000 capital gain
    key: true
explanation: >-
  §751 overrides the general capital treatment: the portion of the gain attributable to unrealized
  receivables and inventory ($30,000) is ordinary income; the remaining $70,000 is capital gain.
  This prevents converting ordinary income (like uncollected fees) into capital gain via a sale of
  the interest. (A) applies the entity theory without the §751 carve-out. (B) overcorrects, treating
  everything as ordinary. (C) inverts the two components.
refs:
  - IRC §741, §751(a)
  - TCP U2-W2
