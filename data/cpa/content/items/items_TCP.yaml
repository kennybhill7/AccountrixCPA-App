id: TCP-MCQ-INDV-0003
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Taxable vs. Tax-Exempt Yield
stem: >-
  An investor in the 32% marginal bracket is choosing between a corporate bond yielding 5.0% and a
  municipal bond yielding 3.5%, equal risk. Which should she choose based on after-tax yield?
options:
  - text: The corporate bond, because 5.0% is greater than 3.5%
    key: false
  - text: The corporate bond, because its after-tax yield is 3.60%
    key: false
  - text: The municipal bond, because municipal bond interest is deductible
    key: false
  - text: >-
      The municipal bond — the corporate bond's after-tax yield is 5.0% × (1 − 0.32) = 3.40%, below
      the tax-exempt 3.5%
    key: true
explanation: >-
  Compare after-tax yields: corporate 5.0% × 0.68 = 3.40% vs. municipal 3.5% tax-exempt. The muni
  wins by 10 basis points. (A) encodes the pre-tax comparison misconception — it ignores that
  corporate interest is fully taxable. (B) computes the after-tax yield with a 28% rate (5.0% × 0.72
  = 3.60%) instead of the taxpayer's 32%. (C) reaches the right pick with wrong law: muni interest
  is EXCLUDED from income under §103, not 'deductible.'
refs:
  - IRC §103
  - TCP U1-W1
