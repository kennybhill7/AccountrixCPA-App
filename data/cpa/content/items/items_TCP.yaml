id: TCP-MCQ-ENTP-0049
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Planning
topic: Corporate Charitable Contributions (2026)
stem: >-
  In 2026 a C corporation with taxable income (before the charitable deduction) of $1,000,000
  contributes $85,000 cash to public charities. Under P.L. 119-21 §70426, contributions are
  deductible only to the extent they EXCEED 1% of taxable income, up to the 10% ceiling. Compute the
  deduction.
options:
  - text: $85,000
    key: false
  - text: $100,000
    key: false
  - text: $75,000
    key: true
  - text: $10,000
    key: false
explanation: >-
  Floor = 1% × $1,000,000 = $10,000; ceiling = 10% × $1,000,000 = $100,000. Deduction = $85,000 −
  $10,000 floor = $75,000 (well under the ceiling). Amounts disallowed by the ceiling carry forward
  five years. (A) applies the pre-2026 rule with no 1% floor. (B) deducts the ceiling rather than
  the contribution actually made. (D) deducts the floor itself — the floor is the DISALLOWED band,
  not the deduction.
refs:
  - IRC §170(b)(2); P.L. 119-21 §70426
  - TCP U2-W2
