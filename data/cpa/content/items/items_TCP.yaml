id: TCP-MCQ-PROP-0042
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Property Transactions (Disposition of Assets)
topic: Related-Party Losses (§267)
stem: >-
  A taxpayer sells stock (basis $100,000) to her brother for $80,000, and the $20,000 loss is
  disallowed under §267. The brother later sells the stock to an unrelated buyer for $95,000. What
  does the brother recognize?
options:
  - text: $0 — his $15,000 realized gain is fully offset by the previously disallowed loss
    key: true
  - text: $15,000 gain
    key: false
  - text: $5,000 loss
    key: false
  - text: $15,000 gain to the brother, and the sister may amend her return to deduct her $20,000 loss
    key: false
explanation: >-
  The related buyer's gain is reduced (but not below zero) by the seller's disallowed loss: realized
  gain $95,000 − $80,000 = $15,000, offset by up to $20,000 of disallowed loss → $0 recognized. The
  remaining $5,000 of disallowed loss simply disappears. (B) ignores the offset rule. (C) uses the
  full $20,000 against the $15,000 gain to create a loss — the offset cannot go below zero. (D) lets
  the loss revert to the original seller, which §267 never allows.
refs:
  - IRC §267(a), (d)
  - TCP U2-W1
