id: TCP-MCQ-INDV-0005
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Alimony After 2018
stem: >-
  Under a divorce agreement executed in 2022, Dana pays her ex-spouse $30,000 per year of alimony.
  For 2026, how is it treated?
options:
  - text: Not deductible by Dana and not gross income to the recipient — the post-2018 rule applies
    key: true
  - text: Deductible by Dana and gross income to the recipient
    key: false
  - text: Gross income to the recipient, but not deductible by Dana
    key: false
  - text: Deductible by Dana only as an itemized deduction
    key: false
explanation: >-
  For divorce or separation instruments executed after December 31, 2018, alimony is neither
  deductible by the payor nor includible by the recipient — and this treatment is permanent under
  the current baseline. (B) is the pre-2019 regime, which applies only to older, unmodified
  agreements. (C) creates asymmetric double taxation that exists under neither regime. (D) is doubly
  wrong — even under the old regime, alimony was an above-the-line deduction, never itemized.
refs:
  - P.L. 115-97 §11051; IRC §61
  - TCP U1-W1
