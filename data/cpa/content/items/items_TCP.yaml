id: TCP-MCQ-DEDC-0010
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: SALT Phasedown Computation
stem: >-
  In 2026 a MFJ couple with MAGI of $600,000 pays $35,000 of state and local taxes. The 2026 SALT
  cap is $40,400, reduced by 30% of MAGI over $505,000, but not below a $10,000 floor. What is their
  SALT deduction?
options:
  - text: $10,000 — high-income taxpayers always drop to the floor
    key: false
  - text: $35,000 — the full amount paid
    key: false
  - text: $11,900
    key: true
  - text: $40,400
    key: false
explanation: >-
  Phasedown: excess MAGI = $600,000 − $505,000 = $95,000; reduction = 30% × $95,000 = $28,500;
  reduced cap = $40,400 − $28,500 = $11,900, which is above the $10,000 floor. Deduction = lesser of
  taxes paid ($35,000) or the reduced cap = $11,900. (A) jumps straight to the floor — the phasedown
  is gradual, and this couple's cap stops at $11,900. (B) ignores the cap/phasedown mechanism
  entirely. (D) applies the unreduced cap, ignoring the MAGI phasedown.
refs:
  - P.L. 119-21 §70120
  - TCP U1-W2
