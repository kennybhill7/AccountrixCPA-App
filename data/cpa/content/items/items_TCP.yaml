id: TCP-MCQ-PFPL-0053
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Roth vs. Traditional Decision
stem: >-
  A 28-year-old associate in the 12% bracket expects to be in a much higher bracket in retirement.
  For new retirement contributions, the tax-optimal choice is generally:
options:
  - text: A traditional (pre-tax) account, because deferral always wins
    key: false
  - text: Neither — a taxable brokerage account beats both
    key: false
  - text: A Roth account — pay tax now at 12% and withdraw tax-free later at the higher expected rate
    key: true
  - text: A traditional account, because Roth contributions are deductible
    key: false
explanation: >-
  The Roth-vs-traditional decision turns on current versus expected future marginal rates: pay 12%
  now (Roth) rather than deduct at 12% and later withdraw at a higher rate (traditional). (A)
  encodes the 'deferral always wins' misconception — deferral loses when the future rate is higher.
  (B) forfeits tax-advantaged growth entirely. (D) contains a factual error: Roth contributions are
  NEVER deductible; that is the traditional side's feature.
refs:
  - IRC §408A
  - TCP U2-W3
