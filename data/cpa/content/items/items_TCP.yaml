id: TCP-MCQ-GIFT-0025
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Portability (DSUE)
stem: >-
  A husband dies in 2026 having used $9,000,000 of his $15,000,000 exclusion; his executor timely
  elects portability. Ignoring future indexing, what total exclusion can his surviving wife's estate
  ultimately use?
options:
  - text: $15,000,000 — exclusions cannot be shared between spouses
    key: false
  - text: $30,000,000
    key: false
  - text: $21,000,000 — her own $15,000,000 plus his $6,000,000 unused (DSUE) amount
    key: true
  - text: $24,000,000
    key: false
explanation: >-
  The DSUE amount is the deceased spouse's UNUSED exclusion: $15M − $9M = $6M. With a timely
  portability election, the survivor stacks it on her own $15M for a $21M total shield. (A) ignores
  portability, which has been available since 2011. (B) assumes both exclusions transfer in full
  even though $9M was already consumed. (D) adds the $9M USED portion instead of the $6M unused
  portion.
refs:
  - IRC §2010(c)
  - TCP U1-W3
