id: TCP-MCQ-PROP-0043
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Property Transactions (Disposition of Assets)
topic: Installment Sale
stem: >-
  Land with a basis of $300,000 is sold for $500,000, payable $100,000 per year for five years
  (ignore interest). Under the installment method, how much gain is recognized in Year 1?
options:
  - text: $100,000
    key: false
  - text: $200,000
    key: false
  - text: $60,000
    key: false
  - text: $40,000
    key: true
explanation: >-
  Gross profit = $200,000; gross profit percentage = $200,000 ÷ $500,000 = 40%. Year 1 gain = 40% ×
  $100,000 collected = $40,000. (A) treats all cash received as gain, ignoring basis recovery. (B)
  recognizes the entire gain in the year of sale — that happens only if the taxpayer ELECTS OUT of
  installment reporting. (C) applies the basis-recovery percentage (60%) instead of the gross-profit
  percentage.
refs:
  - IRC §453
  - TCP U2-W1
