id: TCP-MCQ-ENTC-0033
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Entity Tax Planning
topic: Qualified Small Business Stock (§1202)
stem: >-
  A founder acquired qualified small business stock at original issue AFTER the July 2025 enactment
  of P.L. 119-21 and sells it after exactly 4 years, realizing a $2,000,000 gain (within the
  per-issuer cap). How much gain is taxable?
options:
  - text: $0 — all QSBS gain is excluded
    key: false
  - text: $1,000,000
    key: false
  - text: $500,000 — the 4-year tier excludes 75%
    key: true
  - text: $2,000,000 — no exclusion applies until the stock is held 5 years
    key: false
explanation: >-
  For post-enactment QSBS, P.L. 119-21 replaced the 5-year cliff with tiers: 50% exclusion after 3
  years, 75% after 4, 100% after 5. At 4 years: 75% × $2,000,000 = $1,500,000 excluded; $500,000
  taxable. (A) applies the 100% tier, which needs 5 years. (B) applies the 50% (3-year) tier. (D) is
  the OLD pre-enactment rule — an all-or-nothing 5-year requirement — which still governs older
  stock but not shares issued after enactment.
refs:
  - IRC §1202; P.L. 119-21
  - TCP U1-W4
