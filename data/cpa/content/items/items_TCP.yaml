id: TCP-MCQ-PROP-0039
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Property Transactions (Disposition of Assets)
topic: Like-Kind Exchange — Basis of Replacement
stem: >-
  Same exchange: basis given up $280,000; replacement property worth $350,000; $50,000 cash boot
  received; realized gain $120,000; recognized gain $50,000. What is the basis of the replacement
  property?
options:
  - text: $350,000
    key: false
  - text: $330,000
    key: false
  - text: $230,000
    key: false
  - text: $280,000
    key: true
explanation: >-
  Basis = adjusted basis given up + gain recognized − boot received = $280,000 + $50,000 − $50,000 =
  $280,000. Check: FMV of replacement ($350,000) − deferred gain ($70,000) = $280,000 ✓ — the
  deferred gain is embedded in a lower basis so it is taxed on the eventual sale. (A) uses cost/FMV
  basis, which would erase the deferral. (B) adds the recognized gain but forgets to subtract the
  boot. (C) subtracts the boot but forgets to add the recognized gain.
refs:
  - IRC §1031(d)
  - TCP U2-W1
