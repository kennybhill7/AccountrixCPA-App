id: TCP-MCQ-ENTP-0048
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Entity Tax Compliance
topic: Built-In Gains Tax
stem: >-
  A C corporation elects S status on January 1, 2026, holding land with a $200,000 built-in gain at
  conversion. The S corporation sells the land in 2027 — within the 5-year recognition period. What
  entity-level tax results (21% corporate rate)?
options:
  - text: $0 — S corporations never pay entity-level federal income tax
    key: false
  - text: >-
      $42,000 of built-in gains tax at the corporate level, and the gain (less the tax) also passes
      through to shareholders
    key: true
  - text: $47,600 — the gain is taxed at the 23.8% shareholder capital-gains rate
    key: false
  - text: $84,000 — the gain is taxed at both the corporate and shareholder level at 21% each
    key: false
explanation: >-
  §1374 imposes a corporate-level tax on net recognized built-in gain sold within 5 years of
  conversion: 21% × $200,000 = $42,000; the gain also flows through to shareholders (reduced by the
  tax paid). Waiting out the 5-year period would have avoided it. (A) overstates the pass-through
  rule — BIG tax, excess net passive income tax, and LIFO recapture are entity-level exceptions. (C)
  applies the shareholder rate at the entity level. (D) invents a double 21% — the corporate BIG tax
  plus SHAREHOLDER-level pass-through tax is the real structure, not two corporate taxes.
refs:
  - IRC §1374
  - TCP U2-W2
