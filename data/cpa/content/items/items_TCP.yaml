id: TCP-MCQ-GIFT-0027
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Present Interest & Crummey Powers
stem: >-
  A grandmother funds an irrevocable trust for her grandchildren and wants the contributions to
  qualify for the $19,000 annual exclusion. What is required?
options:
  - text: Nothing — all gifts in trust automatically qualify
    key: false
  - text: Gifts in trust can never qualify for the annual exclusion
    key: false
  - text: Filing a gift-tax return is sufficient to qualify the gifts
    key: false
  - text: >-
      The beneficiaries must receive a present interest — typically a temporary right to withdraw
      contributions (a Crummey power)
    key: true
explanation: >-
  The annual exclusion applies only to PRESENT interests. A gift to a trust is normally a future
  interest — unless beneficiaries hold a Crummey withdrawal right, which converts each contribution
  into a present interest. (A) ignores the present-interest requirement entirely. (B) overcorrects;
  Crummey powers exist precisely to fix this. (C) confuses reporting with qualification — a Form 709
  reports the gift but cannot transform a future interest into a present one.
refs:
  - IRC §2503(b); Crummey v. Comm'r
  - TCP U1-W3
---
id: TCP-MCQ-GIFT-0028
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Educational Exclusion (§2503(e))
stem: >-
  In 2026 a grandmother pays $80,000 of her grandson's tuition directly to the university and
  separately gives him $19,000 cash. What is her taxable gift?
options:
  - text: $80,000
    key: false
  - text: >-
      $0 — direct tuition payments are excluded without limit under §2503(e), and the cash is
      covered by the annual exclusion
    key: true
  - text: $61,000
    key: false
  - text: $99,000
    key: false
explanation: >-
  Tuition paid DIRECTLY to the educational institution is excluded from gift tax without dollar
  limit and without consuming the annual exclusion; the separate $19,000 cash gift fits exactly
  within the annual exclusion. Taxable gift: $0. (A) treats the tuition as a normal gift. (C) wastes
  the annual exclusion against the tuition ($80,000 − $19,000) and then taxes the cash. (D) excludes
  nothing. Key trap: the exclusion fails if the money is given TO the student to pay tuition —
  payment must go straight to the school.
refs:
  - IRC §2503(e)
  - TCP U1-W3
