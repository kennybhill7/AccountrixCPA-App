id: TCP-MCQ-ENTC-0034
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Entity Tax Planning
topic: Check-the-Box Classification
stem: >-
  Absent any election, how are (1) a two-member LLC and (2) a single-member LLC classified for
  federal income tax?
options:
  - text: (1) Partnership; (2) disregarded entity taxed directly to its owner
    key: true
  - text: Both are automatically taxed as C corporations
    key: false
  - text: (1) S corporation; (2) sole proprietorship
    key: false
  - text: Both must be taxed as C corporations unless they elect partnership status
    key: false
explanation: >-
  Default classifications under the check-the-box regulations: a domestic multi-member LLC is a
  partnership; a single-member LLC is disregarded (activity reported on the owner's return). Either
  may ELECT corporate treatment (and then S status if eligible). (B) and (D) reverse the regime —
  corporate treatment requires an affirmative election, never the default. (C) encodes the
  misconception that S status can arise by default; it always requires an eligible entity to elect
  corporate classification and file an S election.
refs:
  - Reg. §301.7701-3
  - TCP U1-W4
