id: TCP-MCQ-INDV-0002
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Bunching Deductions
stem: >-
  A MFJ couple has $28,000 of recurring itemized deductions each year (capped SALT plus mortgage
  interest) and normally gives $12,000 to charity annually. Assume a $32,600 MFJ standard deduction
  in both years. If they 'bunch' two years of giving ($24,000) into Year 1 and give $0 in Year 2,
  how much MORE do they deduct over the two years versus giving $12,000 each year?
options:
  - text: $4,600
    key: true
  - text: $0 — total gifts are identical, so total deductions are identical
    key: false
  - text: $12,000
    key: false
  - text: $19,400
    key: false
explanation: >-
  Unbunched: $28,000 + $12,000 = $40,000 itemized each year (exceeds $32,600), total $80,000.
  Bunched: Year 1 itemizes $28,000 + $24,000 = $52,000; Year 2 takes the $32,600 standard deduction;
  total $84,600. Extra = $84,600 − $80,000 = $4,600 — the standard deduction 'replaces' forgone
  itemizing in the off year. (B) encodes the misconception that equal cash outflow means equal
  deductions, ignoring the standard-deduction floor. (C) treats the shifted $12,000 gift as pure
  extra deduction. (D) is $52,000 − $32,600, comparing only Year 1's two options and ignoring Year 2
  entirely.
refs:
  - IRC §63; §170
  - TCP U1-W1
  - TCP U1-W2
