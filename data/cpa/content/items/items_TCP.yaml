id: TCP-MCQ-ENTC-0032
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Planning
topic: Guaranteed Payments
stem: >-
  A partnership pays a partner a $96,000 guaranteed payment for services, determined without regard
  to partnership income. Which statement is correct?
options:
  - text: It is taxable to the partner only in years the partnership is profitable
    key: false
  - text: >-
      It is ordinary income to the partner, subject to self-employment tax, and deductible by the
      partnership in computing ordinary business income
    key: true
  - text: It is a qualified dividend taxed at capital-gain rates
    key: false
  - text: It is exempt from self-employment tax because the partner is an owner, not an employee
    key: false
explanation: >-
  Guaranteed payments under §707(c) are compensation-like: ordinary income and SE income to the
  partner, and a deduction to the partnership regardless of profitability — the feature that
  distinguishes them from a distributive share. (A) describes a distributive share; guaranteed
  payments are payable and taxable even in loss years. (C) confuses partnerships with C corporations
  — partnerships pay no dividends. (D) is backwards: a general partner's service income, including
  guaranteed payments, is squarely SE income.
refs:
  - IRC §707(c); §1402(a)
  - TCP U1-W4
  - TCP U2-W2
