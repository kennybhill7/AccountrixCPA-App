id: TCP-MCQ-ENTC-0031
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Planning
topic: S Corporation Eligibility
stem: Which event would TERMINATE (or bar) a corporation's S election?
options:
  - text: Reaching exactly 100 shareholders
    key: false
  - text: Issuing voting and nonvoting common stock with identical distribution and liquidation rights
    key: false
  - text: Admitting a resident-alien individual as a shareholder
    key: false
  - text: Admitting a partnership as a shareholder
    key: true
explanation: >-
  S corporation shareholders must be individuals (plus certain estates, trusts, and exempt
  organizations) — a partnership shareholder terminates the election immediately. (A) 100
  shareholders is exactly AT the limit, which permits up to 100. (B) differences in VOTING rights
  alone do not violate the one-class-of-stock rule as long as distribution/liquidation rights are
  identical. (C) the prohibition is on NONRESIDENT aliens; resident aliens are permissible
  shareholders.
refs:
  - IRC §1361(b)
  - TCP U1-W4
  - TCP U2-W2
