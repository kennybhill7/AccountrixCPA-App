id: TCP-MCQ-ENTP-0046
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Compliance
topic: Partnership Outside Basis at Formation
stem: >-
  A partner contributes property with an adjusted basis of $50,000 (FMV $80,000) subject to a
  $20,000 recourse liability the partnership assumes. Her share of partnership liabilities is 25%.
  Compute her initial outside basis.
options:
  - text: $35,000
    key: true
  - text: $50,000
    key: false
  - text: $30,000
    key: false
  - text: $80,000
    key: false
explanation: >-
  Outside basis = basis of property contributed $50,000 − liability shifted to OTHER partners (75% ×
  $20,000 = $15,000 deemed cash distribution) = $35,000. Equivalently: $50,000 − $20,000 relief +
  $5,000 retained share. (B) ignores the liability shift entirely. (C) subtracts the full $20,000
  relief but forgets she keeps her own 25% share ($5,000) as a deemed contribution. (D) uses FMV —
  contributions to partnerships take carryover basis under §722, not FMV.
refs:
  - IRC §722, §752
  - TCP U2-W2
