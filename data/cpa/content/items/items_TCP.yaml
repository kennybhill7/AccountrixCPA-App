id: TCP-MCQ-DEDC-0013
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: QBI Wage/UBIA Limitation
stem: >-
  A married taxpayer well above the §199A threshold owns a non-SSTB business with QBI of $400,000,
  W-2 wages of $120,000, and UBIA of qualified property of $600,000. Taxable income before QBI is
  $700,000 with no net capital gain. Compute the QBI deduction.
options:
  - text: $60,000
    key: true
  - text: $80,000
    key: false
  - text: $45,000
    key: false
  - text: $140,000
    key: false
explanation: >-
  Above the threshold the deduction is the lesser of 20% × QBI ($80,000) or the wage/UBIA limit —
  the GREATER of 50% × W-2 wages (50% × $120,000 = $60,000) or 25% × wages + 2.5% × UBIA ($30,000 +
  $15,000 = $45,000). Greater = $60,000; lesser of $80,000 vs. $60,000 = $60,000 (the
  20%-of-taxable-income cap, $140,000, doesn't bind). (B) ignores the wage limitation. (C) uses the
  LESSER of the two wage tests instead of the greater. (D) is 20% of taxable income — the overall
  cap, not the deduction.
refs:
  - IRC §199A(b)(2)
  - TCP U1-W2
