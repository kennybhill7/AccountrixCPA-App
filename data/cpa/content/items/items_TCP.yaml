id: TCP-MCQ-ENTP-0052
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Entity Tax Compliance
topic: Net Operating Losses (Post-2017)
stem: >-
  A corporation has taxable income of $100,000 in 2026 (before any NOL deduction) and a $150,000 NOL
  carryforward that arose in 2023. How much NOL may it deduct in 2026?
options:
  - text: $100,000 — NOLs fully offset taxable income
    key: false
  - text: >-
      $80,000 — post-2017 NOLs are limited to 80% of taxable income; the remaining $70,000 carries
      forward indefinitely
    key: true
  - text: $150,000, creating a $50,000 refundable loss
    key: false
  - text: $0 — NOLs may only be carried back
    key: false
explanation: >-
  Post-2017 NOLs carry forward indefinitely (no general carryback) but may offset only 80% of
  taxable income: 80% × $100,000 = $80,000 deducted, leaving $20,000 taxable and a $70,000
  carryforward. (A) applies the pre-2018 100% offset rule. (C) deducts beyond taxable income — NOLs
  cannot create negative income or refunds. (D) reverses the rule: carrybacks are what post-2017 law
  generally ELIMINATED.
refs:
  - IRC §172(a), (b)
  - TCP U2-W2
