id: TCP-MCQ-DEDC-0015
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Charitable Contribution Limits
stem: >-
  In 2026 a taxpayer with AGI of $100,000 donates $30,000 cash to a public charity plus long-term
  appreciated stock worth $40,000 (basis $10,000). What is her current-year charitable deduction?
options:
  - text: $70,000 — both gifts in full
    key: false
  - text: >-
      $60,000 — $30,000 cash plus stock capped at 30% of AGI, with $10,000 carried forward up to
      five years
    key: true
  - text: $40,000 — $30,000 cash plus the stock's $10,000 basis
    key: false
  - text: $30,000 — all gifts limited to 30% of AGI
    key: false
explanation: >-
  Cash to public charities is deductible up to 60% of AGI, so the $30,000 is fully allowed.
  Appreciated long-term-gain property is deducted at FMV but capped at 30% of AGI = $30,000; the
  excess $10,000 carries forward five years. Total current deduction $60,000. (A) ignores the 30%
  property ceiling. (C) wrongly deducts the stock at basis — FMV applies (that's the point of
  gifting appreciated stock: the gain is never taxed). (D) applies the 30% ceiling to the cash gift
  too.
refs:
  - IRC §170(b), §170(e)
  - TCP U1-W2
