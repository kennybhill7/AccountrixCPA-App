id: TCP-MCQ-ENTP-0050
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Planning
topic: Reasonable Compensation Risk
stem: >-
  The sole shareholder-employee of a profitable S corporation works full-time managing the business
  but takes no salary, withdrawing $180,000 as distributions to avoid payroll taxes. The PRIMARY tax
  risk is:
options:
  - text: >-
      The IRS recharacterizes distributions as wages, assessing employment taxes, penalties, and
      interest on a reasonable-compensation amount
    key: true
  - text: None — S corporation distributions are always tax-free to shareholders
    key: false
  - text: The distributions become qualified dividends taxed at 15%
    key: false
  - text: The S election terminates automatically after one year of zero salary
    key: false
explanation: >-
  Rev. Rul. 74-44 and abundant case law let the IRS recharacterize distributions as reasonable
  compensation for services actually rendered, retroactively imposing FICA/FUTA, penalties, and
  interest. The savings strategy works only with a defensible salary. (B) confuses basis-covered
  distributions being income-tax-free with immunity from wage recharacterization. (C) imports C
  corporation dividend treatment into an S corporation. (D) invents a termination trigger —
  compensation practices, however aggressive, do not terminate an S election.
refs:
  - Rev. Rul. 74-44; IRC §3121
  - TCP U2-W2
