id: TCP-MCQ-DEDC-0017
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Child Tax Credit Phase-Out
stem: >-
  Assume a $2,200-per-child child tax credit in 2026, phased out at $50 per $1,000 (or fraction) of
  MAGI above $400,000 MFJ. A MFJ couple with MAGI of $420,000 has three qualifying children under
  17. Compute their credit.
options:
  - text: $5,600
    key: true
  - text: $6,600
    key: false
  - text: $6,000
    key: false
  - text: $4,600
    key: false
explanation: >-
  Tentative credit = 3 × $2,200 = $6,600. Phase-out = ($420,000 − $400,000) ÷ $1,000 = 20 increments
  × $50 = $1,000 reduction. Credit = $6,600 − $1,000 = $5,600. (B) forgets the phase-out entirely.
  (C) uses the outdated $2,000-per-child figure with no phase-out. (D) applies $100 per $1,000
  instead of $50, doubling the reduction to $2,000.
refs:
  - IRC §24
  - TCP U1-W2
