id: TCP-MCQ-GIFT-0023
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Holding Period of Gifted Property
stem: Which statement correctly describes the donee's holding period for gifted property?
options:
  - text: It always includes the donor's holding period
    key: false
  - text: It always begins on the date of the gift
    key: false
  - text: It includes the donor's holding period only if gift tax was paid
    key: false
  - text: >-
      It includes (tacks) the donor's holding period when the carryover basis applies, but begins at
      the gift date when the FMV loss basis is used
    key: true
explanation: >-
  Tacking under §1223(2) follows the basis: when the donee's basis is determined by reference to the
  donor's (carryover/gain basis), the donor's holding period tacks; when the FMV-at-gift loss basis
  applies, the holding period starts fresh at the gift date. (A) ignores the loss-basis exception.
  (B) throws away tacking in the normal carryover case. (C) confuses tacking with the gift-tax basis
  ADJUSTMENT — paying gift tax can increase basis but is not what triggers tacking.
refs:
  - IRC §1223(2), §1015
  - TCP U1-W3
  - TCP U2-W1
