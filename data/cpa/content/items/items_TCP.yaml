id: TCP-MCQ-ENTC-0030
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Entity Tax Planning
topic: C Corporation Double Taxation
stem: >-
  A C corporation earns $100,000, pays the 21% corporate tax, and distributes all remaining earnings
  as a qualified dividend taxed to the shareholder at 23.8% (20% + 3.8% NIIT). Compute the total
  combined tax.
options:
  - text: $39,802
    key: true
  - text: $21,000
    key: false
  - text: $44,800
    key: false
  - text: $18,802
    key: false
explanation: >-
  Corporate tax = 21% × $100,000 = $21,000. Dividend = $79,000; shareholder tax = 23.8% × $79,000 =
  $18,802. Combined = $21,000 + $18,802 = $39,802 (an effective 39.8% — the double-tax cost to weigh
  against pass-through treatment). (B) counts only the corporate layer. (C) applies both rates to
  the full $100,000 ($21,000 + $23,800), forgetting the dividend is the after-tax remainder. (D)
  counts only the shareholder layer.
refs:
  - IRC §11; §1(h); §1411
  - TCP U1-W4
