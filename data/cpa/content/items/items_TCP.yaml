id: TCP-MCQ-GIFT-0026
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Gift Now vs. Bequest — Basis Planning
stem: >-
  A widow holds stock with basis $100,000, FMV $900,000. Option 1: gift it to her son now; he sells
  at $950,000. Option 2: he inherits it at her death (FMV then $900,000) and sells at $950,000.
  Assuming a combined 23.8% rate on long-term gains, how much capital-gains tax does inheriting SAVE
  versus the gift?
options:
  - text: $190,400
    key: true
  - text: $202,300
    key: false
  - text: $11,900
    key: false
  - text: $0 — the son's basis is the same either way
    key: false
explanation: >-
  Gift: carryover basis $100,000 → gain $850,000 → tax $202,300. Inheritance: §1014 step-up to
  $900,000 → gain $50,000 → tax $11,900. Savings = $202,300 − $11,900 = $190,400 (equivalently 23.8%
  × the $800,000 basis step-up). (B) is the entire gift-scenario tax, forgetting the heir still pays
  $11,900 on post-death appreciation. (C) is only the inheritance-scenario tax, not the savings. (D)
  encodes the misconception that death, like gifting, carries basis over — §1014 resets basis to
  date-of-death FMV.
refs:
  - IRC §1014 vs. §1015
  - TCP U1-W3
  - TCP U2-W1
