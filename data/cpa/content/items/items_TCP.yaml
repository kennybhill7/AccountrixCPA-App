id: TCP-MCQ-ENTP-0047
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Entity Tax Compliance
topic: Partnership Cash Distributions
stem: >-
  A partner with an outside basis of $25,000 receives a $40,000 current (non-liquidating) cash
  distribution. What does she recognize?
options:
  - text: $0 — partnership distributions are never taxable
    key: false
  - text: $40,000 of ordinary income
    key: false
  - text: $15,000 of ordinary income
    key: false
  - text: $15,000 of capital gain — cash distributed in excess of outside basis
    key: true
explanation: >-
  Cash distributions reduce outside basis first; only the excess over basis is taxable: $40,000 −
  $25,000 = $15,000, treated as gain from the sale of the partnership interest — capital gain. (A)
  states the general nonrecognition rule but ignores its limit at zero basis. (B) taxes the entire
  distribution, ignoring basis recovery. (C) has the right amount but the wrong character — the
  excess is capital, not ordinary (absent §751 hot-asset issues).
refs:
  - IRC §731(a)
  - TCP U2-W2
