id: TCP-MCQ-PROC-0057
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Failure-to-File and Failure-to-Pay Penalties
stem: >-
  A taxpayer owing $10,000 files his return and pays in full exactly 3 months after the (unextended)
  due date. The failure-to-file penalty is 5% per month (reduced by the concurrent 0.5%
  failure-to-pay penalty), each capped at 25%. Compute the total combined penalty.
options:
  - text: $150
    key: false
  - text: $1,650
    key: false
  - text: $1,500 — 5% × 3 months × $10,000, combined
    key: true
  - text: $2,500
    key: false
explanation: >-
  When both penalties run concurrently, the combined charge is 5% per month (4.5% FTF + 0.5% FTP):
  5% × 3 × $10,000 = $1,500. The lesson: FILE on time even if you cannot pay — filing alone drops
  the monthly rate from 5% to 0.5%. (A) is the FTP-only amount ($10,000 × 0.5% × 3), as if the
  return had been timely filed. (B) stacks the full 5% FTF on top of the 0.5% FTP without the offset
  (5.5% × 3). (D) jumps straight to the 25% maximum, which takes 5 months to reach.
refs:
  - IRC §6651(a), (c)
  - TCP U2-W4
