id: TCP-MCQ-PROP-0035
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Property Transactions (Disposition of Assets)
topic: Sale of Principal Residence (§121)
stem: >-
  A single taxpayer sells her principal residence, which she owned and occupied for six years,
  realizing a $300,000 gain. She has not used the exclusion in the prior two years. What gain is
  taxable?
options:
  - text: $300,000
    key: false
  - text: $0
    key: false
  - text: $250,000
    key: false
  - text: $50,000
    key: true
explanation: >-
  A single filer meeting the 2-of-5-year ownership and use tests excludes up to $250,000; taxable
  gain = $300,000 − $250,000 = $50,000. (A) ignores §121 entirely. (B) applies the $500,000 MFJ
  exclusion to a single filer. (C) reports the EXCLUDED amount as the taxable amount — a
  swapped-labels error.
refs:
  - IRC §121
  - TCP U2-W1
