id: TCP-MCQ-GIFT-0022
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Gift Basis — Loss Sale
stem: >-
  Same gift: donor's basis $60,000, FMV at gift $40,000. The daughter instead sells the stock for
  $35,000. What does she recognize?
options:
  - text: $5,000 loss — using the $40,000 FMV-at-gift loss basis
    key: true
  - text: $25,000 loss — using the donor's $60,000 basis
    key: false
  - text: $0 — gifts of loss property never produce recognizable losses
    key: false
  - text: $5,000 gain
    key: false
explanation: >-
  Selling below the FMV-at-gift figure triggers the loss basis: $35,000 − $40,000 = $5,000 loss. (B)
  uses the carryover basis for a loss sale — exactly what §1015 forbids, because it would transfer
  the donor's $20,000 built-in loss to the donee. (C) overreads the rule: losses ARE allowed, just
  measured from FMV at gift; only the pre-gift decline is disallowed. (D) has the wrong direction
  entirely — the sale price is below both bases.
refs:
  - IRC §1015
  - TCP U1-W3
  - TCP U2-W1
