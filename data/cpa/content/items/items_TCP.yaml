id: TCP-MCQ-INDV-0008
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Compensation Deferral Planning
stem: >-
  An employer tells a cash-basis employee her $20,000 bonus check is ready for pickup December 30,
  Year 1. She waits and picks it up January 5, Year 2. Which statement is correct?
options:
  - text: Income can always be deferred by not collecting the check
    key: false
  - text: The bonus is taxed when deposited, so it is Year 2 income
    key: false
  - text: Asking payroll on December 31 to hold the available check shifts it to Year 2
    key: false
  - text: >-
      The bonus is Year 1 income — it was made available without substantial restriction, so it was
      constructively received in Year 1
    key: true
explanation: >-
  Constructive receipt: income credited or set apart so the taxpayer may draw on it is taxed when
  made available, not when collected. Valid deferral requires arranging payment terms BEFORE the
  amount becomes available (e.g., an advance election under a deferred-comp plan). (A) and (B)
  restate the same deposit/collection misconception the doctrine forecloses. (C) fails because the
  request comes after availability — a taxpayer cannot 'turn his back' on income already available.
refs:
  - Reg. §1.451-2
  - TCP U1-W1
