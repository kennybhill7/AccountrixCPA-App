id: TCP-MCQ-PFPL-0054
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Roth Conversion
stem: >-
  A 50-year-old converts $50,000 from a traditional IRA (all pre-tax) to a Roth IRA in a year when
  her marginal rate is 22%, paying the tax from outside funds. What is the immediate federal
  income-tax cost, and does the 10% early-distribution penalty apply?
options:
  - text: $11,000 of tax; no 10% penalty — a proper conversion is not a penalized early distribution
    key: true
  - text: $0 — Roth conversions are tax-free
    key: false
  - text: $16,000 — $11,000 of tax plus a $5,000 penalty
    key: false
  - text: $5,000 — the 10% penalty only
    key: false
explanation: >-
  A conversion is taxable as ordinary income: 22% × $50,000 = $11,000, but it is exempt from the
  §72(t) 10% penalty (though converted amounts have their own 5-year clock for penalty-free
  withdrawal). Paying the tax with outside funds keeps the full $50,000 growing tax-free. (B)
  confuses conversions with trustee-to-trustee ROLLOVERS between like accounts. (C) wrongly adds the
  early-distribution penalty to a conversion. (D) applies the penalty INSTEAD of the income tax —
  backwards on both counts.
refs:
  - IRC §408A(d)(3); §72(t)
  - TCP U2-W3
