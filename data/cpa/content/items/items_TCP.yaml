id: TCP-MCQ-INDV-0007
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Incentive Stock Options & AMT
stem: >-
  In 2026 an executive exercises incentive stock options on 2,000 shares at a $10 strike price when
  the stock trades at $35, and holds the shares. What are the regular-tax and AMT consequences of
  the exercise?
options:
  - text: No regular-tax income; no AMT adjustment until the shares are sold
    key: false
  - text: >-
      No regular-taxable income, but a $50,000 positive AMT adjustment — 2,000 × ($35 − $10) bargain
      element
    key: true
  - text: $70,000 of ordinary income for both regular tax and AMT
    key: false
  - text: $20,000 of ordinary income — 2,000 shares × the $10 strike price
    key: false
explanation: >-
  A qualifying ISO exercise produces no regular-tax income, but the bargain element — 2,000 × ($35 −
  $10) = $50,000 — is an AMT adjustment in the exercise year, the classic AMT trap that survives
  under the 2026 baseline. (A) encodes the misconception that AMT also waits for sale; the
  adjustment hits at EXERCISE when shares are held. (C) describes a NONQUALIFIED option, which
  generates ordinary income at exercise — ISOs do not. (D) multiplies shares by strike price, a
  number with no tax meaning here.
refs:
  - IRC §421; §56(b)(3)
  - TCP U1-W2
