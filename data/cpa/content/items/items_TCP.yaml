id: TCP-MCQ-PROP-0041
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Property Transactions (Disposition of Assets)
topic: Unrecaptured §1250 Gain
stem: >-
  An investor sells a commercial building held for years, recognizing a $150,000 gain. Straight-line
  depreciation of $200,000 was taken. How much is 'unrecaptured §1250 gain' taxed at the maximum 25%
  rate?
options:
  - text: $200,000
    key: false
  - text: $0 — straight-line depreciation on realty never affects the tax rate
    key: false
  - text: $150,000 — the lesser of depreciation taken or the recognized gain
    key: true
  - text: $50,000
    key: false
explanation: >-
  Unrecaptured §1250 gain = the LESSER of straight-line depreciation taken ($200,000) or the
  recognized gain ($150,000) = $150,000, taxed at a maximum 25% rather than the usual LTCG rates.
  (A) uses ALL depreciation taken even though it exceeds the gain — the amount can never exceed gain
  recognized. (B) confuses the 25%-rate rule with §1250 ORDINARY recapture (which is indeed $0 for
  straight-line) — the 25% bucket still applies. (D) is the meaningless difference $200,000 −
  $150,000.
refs:
  - IRC §1(h)(6); §1250
  - TCP U2-W1
