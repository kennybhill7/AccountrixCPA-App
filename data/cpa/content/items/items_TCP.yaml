id: TCP-MCQ-GIFT-0019
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Annual Exclusion
stem: >-
  In 2026 an unmarried donor gives her son $50,000 cash. The annual exclusion is $19,000. What is
  her taxable gift?
options:
  - text: $50,000
    key: false
  - text: $31,000
    key: true
  - text: $0 — the lifetime exemption makes it nontaxable
    key: false
  - text: $12,000
    key: false
explanation: >-
  Taxable gift = $50,000 − $19,000 annual exclusion = $31,000. It consumes lifetime exemption (~$15M
  in 2026) so no tax is likely DUE, but the taxable-gift amount — which requires a gift-tax return
  and reduces the remaining exemption — is $31,000. (A) forgets the annual exclusion. (C) encodes
  the exclusion/exemption confusion: the exemption absorbs the tax, but the amount above the annual
  exclusion is still a taxable gift that must be reported. (D) subtracts a $38,000 split-gift
  exclusion unavailable to an unmarried donor.
refs:
  - IRC §2503(b), §2505
  - TCP U1-W3
