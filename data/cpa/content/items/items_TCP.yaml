id: TCP-MCQ-DEDC-0016
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: AMT Adjustments & Preferences
stem: >-
  In computing 2026 alternative minimum taxable income, which item does NOT get added back or
  otherwise adjusted?
options:
  - text: The standard deduction
    key: false
  - text: The bargain element of exercised-and-held incentive stock options
    key: false
  - text: Tax-exempt interest on specified private-activity bonds
    key: false
  - text: Charitable contributions of cash to public charities
    key: true
explanation: >-
  Charitable contributions are allowed for both regular tax and AMT — no addback. (A) the standard
  deduction is disallowed for AMT and effectively added back. (B) the ISO bargain element is a
  classic positive AMT adjustment at exercise. (C) specified private-activity-bond interest is a
  preference item includible in AMTI despite being tax-exempt for regular tax. The distractors are
  the three headline AMT triggers students most need to know still operate in 2026.
refs:
  - IRC §§55-57
  - TCP U1-W2
