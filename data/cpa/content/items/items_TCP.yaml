id: TCP-MCQ-GIFT-0021
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Gift Basis — Dual-Basis Rule
stem: >-
  A father gifts stock to his daughter when its FMV is $40,000; his basis is $60,000. She later
  sells it for $45,000. What gain or loss does she recognize?
options:
  - text: $15,000 loss
    key: false
  - text: $5,000 gain
    key: false
  - text: $0 — no gain and no loss
    key: true
  - text: $20,000 loss
    key: false
explanation: >-
  Dual-basis rule: for GAIN use the donor's $60,000 carryover basis ($45,000 sale → no gain); for
  LOSS use the $40,000 FMV at gift ($45,000 sale → no loss). Selling between the two bases produces
  neither. (A) uses the donor's basis to claim a loss — the loss basis is FMV, which blocks shifting
  the father's built-in loss. (B) uses the FMV loss basis to compute a GAIN, the mirror error. (D)
  simply takes the $60,000 − $40,000 built-in decline, which nobody recognizes.
refs:
  - IRC §1015
  - TCP U1-W3
  - TCP U2-W1
