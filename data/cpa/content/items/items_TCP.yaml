id: TCP-MCQ-DEDC-0012
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: QBI Deduction — Taxable Income Limit
stem: >-
  A sole proprietor (not an SSTB, below all thresholds) has qualified business income of $180,000.
  Her taxable income before the QBI deduction is $160,000, which includes $10,000 of net capital
  gain. Compute the §199A deduction.
options:
  - text: $36,000
    key: false
  - text: $32,000
    key: false
  - text: $34,000
    key: false
  - text: $30,000
    key: true
explanation: >-
  The deduction is the LESSER of 20% × QBI (20% × $180,000 = $36,000) or 20% × (taxable income − net
  capital gain) = 20% × ($160,000 − $10,000) = $30,000. Answer: $30,000. (A) takes 20% of QBI and
  ignores the taxable-income limitation. (B) is 20% × $160,000, forgetting to remove net capital
  gain from the limit base. (C) is 20% × ($180,000 − $10,000), wrongly subtracting the capital gain
  from QBI instead of from taxable income.
refs:
  - IRC §199A(a)
  - TCP U1-W2
