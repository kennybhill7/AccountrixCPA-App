id: TCP-MCQ-DEDC-0009
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: SALT Cap (2026)
stem: >-
  In 2026 a MFJ couple pays $28,000 of state income tax and $18,000 of property tax. Their MAGI is
  well below the SALT phasedown threshold. What is their SALT itemized deduction?
options:
  - text: $40,400 — the 2026 cap under P.L. 119-21
    key: true
  - text: $46,000 — state and local taxes are fully deductible
    key: false
  - text: $10,000
    key: false
  - text: $20,200
    key: false
explanation: >-
  Total SALT paid is $46,000, but the 2026 cap is $40,400 (indexed from $40,000 in 2025) for
  taxpayers below the MAGI phasedown range — so they deduct $40,400. (B) ignores the cap entirely.
  (C) is the old TCJA-era $10,000 cap, which P.L. 119-21 §70120 replaced — $10,000 now survives only
  as the phasedown FLOOR for high earners. (D) is the MFS half-cap misapplied to a joint return.
refs:
  - P.L. 119-21 §70120; IRC §164
  - TCP U1-W2
