id: TCP-MCQ-GIFT-0020
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Gift Splitting
stem: >-
  In 2026 a husband gives $38,000 from his separate account to each of his three children, and his
  wife consents to gift splitting on their gift-tax returns. The annual exclusion is $19,000. What
  are the couple's total taxable gifts?
options:
  - text: $57,000
    key: false
  - text: $114,000
    key: false
  - text: $76,000
    key: false
  - text: >-
      $0 — splitting treats each $38,000 gift as $19,000 from each spouse, fully covered by two
      annual exclusions per donee
    key: true
explanation: >-
  With gift splitting (§2513), each $38,000 gift is treated as made half by each spouse — $19,000
  each — exactly matching each spouse's $19,000 annual exclusion per donee. 3 donees × $38,000 =
  $114,000, all excluded. (A) is the no-splitting answer: ($38,000 − $19,000) × 3 = $57,000 taxable
  to the husband. (B) applies no exclusions at all. (C) applies the exclusion to only one donee
  ($114,000 − $38,000) — the exclusion is per DONEE, not per donor.
refs:
  - IRC §2513, §2503(b)
  - TCP U1-W3
