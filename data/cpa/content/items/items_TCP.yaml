topic: Miscellaneous Itemized Deductions
stem: >-
  In 2026 a site superintendent pays $4,200 of unreimbursed employee expenses (tools, mileage, union
  dues). How much is deductible on his federal return?
options:
  - text: The amount exceeding 2% of AGI, as a miscellaneous itemized deduction
    key: false
  - text: >-
      $0 — miscellaneous 2%-of-AGI itemized deductions are permanently terminated under P.L. 119-21
      §70110
    key: true
  - text: $4,200, as an above-the-line deduction
    key: false
  - text: $0 for 2026, but the deduction returns in 2027 when the suspension expires
    key: false
explanation: >-
  P.L. 119-21 §70110 permanently terminated the miscellaneous 2%-of-AGI itemized deduction category,
  so unreimbursed employee expenses yield $0 (the planning answer is an employer accountable plan).
  (A) is the pre-2018 regime. (C) invents above-the-line treatment that never applied to employee
  expenses generally (narrow exceptions like the educator deduction survive). (D) encodes the
  TCJA-sunset misconception — this is a permanent termination, not a suspension awaiting expiration.
refs:
  - P.L. 119-21 §70110
  - TCP U1-W2
