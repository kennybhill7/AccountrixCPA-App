id: TCP-MCQ-PROP-0036
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Property Transactions (Disposition of Assets)
topic: Partial §121 Exclusion
stem: >-
  A single taxpayer owned and used her home for only 12 months before selling at a $150,000 gain
  because her employer transferred her to a new city. Compute the taxable gain under the reduced
  (partial) exclusion.
options:
  - text: $150,000 — the two-year test was failed, so no exclusion applies
    key: false
  - text: $25,000
    key: true
  - text: $0 — the full $250,000 exclusion still applies
    key: false
  - text: $75,000
    key: false
explanation: >-
  A qualifying employment-related move allows a prorated CEILING: 12/24 × $250,000 = $125,000
  maximum exclusion. Taxable gain = $150,000 − $125,000 = $25,000. (A) denies any relief — the
  reduced exclusion exists precisely for employment, health, and unforeseen-circumstance moves. (C)
  grants the full exclusion without the full two years. (D) prorates the GAIN (12/24 × $150,000
  excluded) instead of prorating the $250,000 ceiling — the classic mechanical error.
refs:
  - IRC §121(c)
  - TCP U2-W1
