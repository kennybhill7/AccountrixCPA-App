id: TCP-MCQ-PROP-0040
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Property Transactions (Disposition of Assets)
topic: Section 1245 Depreciation Recapture
stem: >-
  A contractor sells equipment for $110,000. Original cost was $100,000 and $60,000 of depreciation
  was taken (adjusted basis $40,000). Characterize the $70,000 gain.
options:
  - text: $70,000 of §1231 gain eligible for long-term capital-gain rates
    key: false
  - text: $60,000 of ordinary income (§1245 recapture) and $10,000 of §1231 gain
    key: true
  - text: $70,000 of ordinary income
    key: false
  - text: $10,000 of ordinary income and $60,000 of §1231 gain
    key: false
explanation: >-
  Gain = $110,000 − $40,000 = $70,000. §1245 recaptures as ordinary income the LESSER of
  depreciation taken ($60,000) or gain ($70,000) → $60,000 ordinary; the $10,000 excess (sale price
  over original cost) is §1231 gain. (A) ignores recapture entirely. (C) recaptures more than the
  depreciation taken — the excess over original cost was never depreciation. (D) inverts the two
  components.
refs:
  - IRC §1245
  - TCP U2-W1
