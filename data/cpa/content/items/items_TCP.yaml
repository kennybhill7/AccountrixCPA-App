id: TCP-MCQ-PROC-0059
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Statute of Limitations on Assessment
stem: >-
  A taxpayer timely filed a non-fraudulent return reporting $200,000 of gross income but omitted an
  additional $60,000 of gross income. How long does the IRS have to assess additional tax?
options:
  - text: 3 years from filing — the standard assessment period
    key: false
  - text: Unlimited — any omission leaves the year open forever
    key: false
  - text: 10 years from filing
    key: false
  - text: >-
      6 years from filing — the omission ($60,000) exceeds 25% of the gross income stated on the
      return ($50,000)
    key: true
explanation: >-
  Omitting more than 25% of reported gross income extends the assessment statute to 6 years: $60,000
  > 25% × $200,000 = $50,000, so 6 years applies. (A) is the default period, displaced by the
  substantial omission. (B) describes FRAUD or failure to file, where the period never closes — an
  honest omission is not fraud. (C) confuses the ASSESSMENT statute with the 10-year COLLECTION
  statute that starts after assessment.
refs:
  - IRC §6501(a), (e)
  - TCP U2-W4
