id: TCP-MCQ-INDV-0004
section: TCP
type: MCQ
difficulty: Medium
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Net Investment Income Tax
stem: >-
  A MFJ couple has MAGI of $290,000, including $60,000 of net investment income. The NIIT threshold
  for MFJ is $250,000. Compute the net investment income tax.
options:
  - text: $2,280
    key: false
  - text: $1,520
    key: true
  - text: $3,420
    key: false
  - text: $0
    key: false
explanation: >-
  NIIT = 3.8% × the LESSER of net investment income ($60,000) or the MAGI excess over the threshold
  ($290,000 − $250,000 = $40,000). 3.8% × $40,000 = $1,520. (A) applies 3.8% to the full $60,000
  NII, ignoring the lesser-of rule ($2,280). (C) applies 3.8% to a $90,000 excess computed with the
  $200,000 SINGLE-filer threshold ($3,420). (D) encodes the misconception that NIIT starts only at
  very high incomes such as $500,000.
refs:
  - IRC §1411
  - TCP U1-W1
