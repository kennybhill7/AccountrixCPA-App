id: TCP-MCQ-INDV-0001
section: TCP
type: MCQ
difficulty: Easy
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Constructive Receipt & Income Timing
stem: >-
  A cash-basis consultant's client hand-delivers a $12,000 check on December 29, Year 1. The
  consultant leaves it in a desk drawer and deposits it January 3, Year 2. In which year is the
  $12,000 gross income?
options:
  - text: Year 2, because a cash-basis taxpayer reports income when funds are deposited
    key: false
  - text: Either year, at the taxpayer's election
    key: false
  - text: >-
      Year 1 — the check was received without restriction, so the income was constructively (and
      actually) received in Year 1
    key: true
  - text: Neither year until the client's invoice is formally closed
    key: false
explanation: >-
  A cash-basis taxpayer has income when cash or its equivalent is actually or constructively
  received — an unrestricted check in hand December 29 is Year 1 income; deliberately delaying
  deposit does not defer it. (A) encodes the deposit-date misconception; receipt, not deposit,
  controls. (B) encodes the misconception that timing is elective — the constructive receipt
  doctrine exists precisely to prevent that election. (D) invents an invoice-cycle rule with no
  basis in §451.
refs:
  - IRC §451
  - Reg. §1.451-2
  - TCP U1-W1
