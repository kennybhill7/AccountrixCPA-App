id: TCP-MCQ-PROC-0058
section: TCP
type: MCQ
difficulty: Hard
blueprint_area: Tax Compliance and Planning for Individuals and Personal Financial Planning
topic: Accuracy-Related Penalty
stem: >-
  An individual's correct tax was $60,000 but she reported $48,000 — a $12,000 understatement with
  no disclosure and no substantial authority. The substantial-understatement threshold is the
  greater of 10% of the correct tax or $5,000. Compute the accuracy-related penalty.
options:
  - text: $2,400 — the understatement exceeds $6,000, so the 20% penalty applies to the $12,000
    key: true
  - text: $0 — the understatement is under 25% of gross income
    key: false
  - text: $9,600
    key: false
  - text: $12,000
    key: false
explanation: >-
  Threshold = greater of 10% × $60,000 = $6,000 or $5,000 → $6,000. The $12,000 understatement
  exceeds it, so the §6662 20% penalty applies: 20% × $12,000 = $2,400. Defenses — substantial
  authority or reasonable basis plus disclosure — are absent. (B) imports the 25%-omission test from
  the six-year STATUTE OF LIMITATIONS rule, a different provision. (C) applies 20% to the $48,000
  reported tax instead of the understatement. (D) confuses the penalty with the understatement
  itself (a 100% rate).
refs:
  - IRC §6662(b)(2), (d)
  - TCP U2-W4
