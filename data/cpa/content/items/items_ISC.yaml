id: ISC-MCQ-DATA-0025
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: Data Life Cycle
stem: >-
  A firm's policy requires payroll records to be kept seven years and then securely destroyed with
  documented certificates of destruction. These requirements govern which stages of the data life
  cycle?
options:
  - text: Creation and capture
    key: false
  - text: Retention/archival and destruction
    key: true
  - text: Analysis and visualization
    key: false
  - text: Ingestion and transformation
    key: false
explanation: >-
  Retention periods and defensible, documented destruction are the end-of-life stages of the data
  life cycle. (A) creation/capture governs how data enters the environment. (C) analysis is a usage
  stage — retention rules are not about how data is analyzed. (D) ingestion/transformation are
  pipeline stages that occur while data is active, not how long it is kept or how it is disposed of.
refs:
  - Data life cycle
  - ISC U1-W4
