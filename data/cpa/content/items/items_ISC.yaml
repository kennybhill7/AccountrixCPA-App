id: ISC-MCQ-CYBR-0050
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Vulnerability Scans vs. Penetration Tests
stem: >-
  The audit committee asks the difference between the quarterly 'vulnerability scans' IT runs and
  the annual 'penetration test' by an outside firm. The BEST distinction is:
options:
  - text: >-
      Scans automatically identify and rank known weaknesses; a penetration test has skilled humans
      actively attempt to EXPLOIT weaknesses and chain them to demonstrate real-world impact
    key: true
  - text: They are identical; the pen test just costs more
    key: false
  - text: Scans are performed only by attackers; pen tests only by regulators
    key: false
  - text: A pen test is passive observation, while scanning involves active exploitation
    key: false
explanation: >-
  Vulnerability scanning is automated identification/prioritization of known flaws; penetration
  testing is authorized, human-driven exploitation that proves what an attacker could actually
  achieve (chained attacks, privilege escalation). (B) encodes the interchangeability misconception
  — depth and evidence differ fundamentally. (C) both are legitimate internal/third-party practices;
  neither belongs to attackers or regulators. (D) reverses the two definitions.
refs:
  - Proactive security testing
  - ISC U2-W3
