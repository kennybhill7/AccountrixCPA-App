id: ISC-MCQ-GOVN-0006
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Information Systems and Data Management
topic: Governing Emerging Technology
stem: >-
  Estimators at a builder began pasting confidential bid data into a free public generative-AI tool
  they adopted without IT approval. Governance had no AI policy. Which response BEST addresses the
  root governance failure rather than just the symptom?
options:
  - text: Block the specific AI website at the firewall and take no further action
    key: false
  - text: Terminate the estimators who used the tool
    key: false
  - text: >-
      Establish an acceptable-use policy for emerging technology, an approval path for new tools,
      and monitoring for unsanctioned (shadow IT) usage
    key: true
  - text: Prohibit all use of AI tools permanently across the company
    key: false
explanation: >-
  The root failure is governance of emerging technology: no policy, no intake/approval process, no
  monitoring — so shadow IT filled the vacuum. A policy + approval path + monitoring addresses
  cause, enables safe adoption, and covers the next tool, not just this one. (A) encodes the
  symptom-fix misconception — blocking one URL leaves the governance gap (and hundreds of other
  tools) open. (B) punishes users without fixing the missing policy they never had. (D) encodes the
  over-control misconception — blanket bans drive usage further underground and forfeit legitimate
  value.
refs:
  - COBIT — Managed Innovation
  - Shadow IT governance
  - ISC U1-W1
