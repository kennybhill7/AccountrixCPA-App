id: ISC-MCQ-SDLC-0016
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Conversion Strategies
stem: >-
  Meridian Building Group is replacing its payroll system. An error at go-live would mean employees
  are paid incorrectly. Management wants the LOWEST-risk conversion approach and accepts higher
  cost. Which strategy fits?
options:
  - text: Direct (big-bang) cutover on the first payday of the year
    key: false
  - text: >-
      Parallel operation — run old and new systems together and reconcile results for several pay
      cycles
    key: true
  - text: Phased conversion by module with no overlap of systems
    key: false
  - text: Pilot conversion at one job site with immediate shutdown of the old system everywhere
    key: false
explanation: >-
  Parallel operation is the classic lowest-risk (and most expensive) strategy: both systems process
  the same payrolls and outputs are reconciled, so the old system is a live fallback. (A) direct
  cutover is the cheapest and riskiest — no fallback if the new system miscalculates pay. (C) phased
  limits scope but each phase is still a cutover with no side-by-side verification. (D) encodes a
  contradiction: a true pilot keeps the old system running for non-pilot sites; shutting it down
  everywhere destroys the safety the pilot was meant to provide.
refs:
  - Conversion strategies
  - ISC U1-W3
---
id: ISC-MCQ-SDLC-0017
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Data Conversion Controls
stem: >-
  During migration of 48,000 vendor records to a new ERP, which control MOST directly verifies that
  the migration was complete and accurate?
options:
  - text: Requiring MFA for the migration team
    key: false
  - text: Encrypting the extract files in transit
    key: false
  - text: >-
      Reconciling record counts and control totals (e.g., total open AP balance) between source and
      target, plus sample field-level comparisons
    key: true
  - text: Having the project sponsor sign the project charter
    key: false
explanation: >-
  Completeness and accuracy of converted data are verified by reconciliation: record counts,
  hash/control totals on key balances, and field-level sampling between source and target. (A) MFA
  protects who performs the migration, not whether the data arrived intact. (B) encryption protects
  confidentiality in transit but a complete, accurate ciphertext of a botched extract is still
  botched. (D) a charter authorizes the project; it verifies nothing about data fidelity.
refs:
  - Data conversion controls
  - ISC U1-W3
  - ISC U1-W4
---
id: ISC-MCQ-SDLC-0018
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Development Methodologies
stem: >-
  A firm must build a compliance-reporting system whose requirements are fixed by regulation, fully
  specifiable up front, and unlikely to change. Documentation and formal sign-offs at each stage are
  required by the regulator. Which methodology is the BEST fit?
options:
  - text: Scrum with two-week sprints and evolving requirements
    key: false
  - text: Kanban with continuous deployment to production
    key: false
  - text: No formal methodology — ad hoc development
    key: false
  - text: Waterfall, with sequential phases and stage-gate sign-offs
    key: true
explanation: >-
  Waterfall suits stable, fully specifiable requirements with mandated documentation and sequential
  approvals — exactly this scenario. (A) encodes the 'agile is always better' misconception; agile's
  strength is adapting to CHANGING requirements, which is not the situation, and sprint-based
  evolution complicates fixed regulatory sign-offs. (B) continuous deployment conflicts with
  stage-gate regulatory approval. (D→C) ad hoc development is a control failure, not a methodology.
refs:
  - Waterfall vs. agile
  - ISC U1-W3
---
id: ISC-MCQ-SDLC-0019
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Information Systems and Data Management
topic: Implementation & Post-Implementation Controls
stem: >-
  A new estimating system went live. Which combination BEST reflects proper implementation-stage
  segregation and follow-up? 
options:
  - text: >-
      Developers migrate their own code to production; the project manager performs the
      post-implementation review
    key: false
  - text: >-
      An independent migration function (or controlled automated pipeline) moves approved code;
      business owner formally accepts; a post-implementation review — independent of the project
      team — evaluates whether objectives and benefits were achieved
    key: true
  - text: Operations migrates the code, and no post-implementation review is needed if UAT passed
    key: false
  - text: The steering committee migrates the code personally to ensure tone at the top
    key: false
explanation: >-
  Correct design: migration to production by a party independent of development (librarian function
  or controlled CI/CD with independent approval), formal business acceptance, and an independent
  post-implementation review of outcomes vs. business case. (A) fails twice — developer
  self-migration breaks SoD, and the PM reviewing his own project breaks review independence. (C)
  encodes the misconception that UAT passing ends accountability; PIR evaluates realized benefits
  and residual issues UAT cannot. (D) is an absurd role confusion — governance bodies oversee, they
  don't execute operational tasks.
refs:
  - Post-implementation review; migration SoD
  - ISC U1-W3
---
id: ISC-MCQ-SDLC-0020
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: Test Environments & Data
stem: >-
  A developer wants to test a payroll code fix using the live production database 'because the data
  is realistic.' The BEST response is:
options:
  - text: Allow it, since realistic data produces the best tests
    key: false
  - text: Allow it if the developer promises to be careful
    key: false
  - text: Require testing in a separate environment using masked or sanitized copies of production data
    key: true
  - text: Cancel all testing and deploy directly
    key: false
explanation: >-
  Testing belongs in a non-production environment; if production-like data is needed, it should be
  masked/sanitized to protect confidential payroll information. This preserves both production
  integrity and data privacy. (A) encodes the realism-over-control misconception — realistic data
  can be achieved with masked copies without risking live records and exposing PII. (B) a promise is
  not a control. (D) skipping testing entirely maximizes the very risk testing exists to reduce.
refs:
  - Test environments; data masking
  - ISC U1-W3
  - ISC U1-W4
---
id: ISC-MCQ-DATA-0021
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: Relational Databases & Integrity
stem: >-
  A clerk tries to enter a sales order for customer number 9930, which does not exist in the
  customer table, and the database rejects the insert. Which constraint produced the rejection?
options:
  - text: Referential integrity enforced through a foreign key
    key: true
  - text: A field-length constraint
    key: false
  - text: Entity integrity on the order table's primary key
    key: false
  - text: A user-interface color convention
    key: false
explanation: >-
  The order row's customer number is a foreign key that must match an existing primary key in the
  customer table — referential integrity blocks orphan records. (B) field length restricts
  characters, not relationships. (C) encodes primary/foreign key confusion: entity integrity
  requires the ORDER's own key to be unique and non-null; it says nothing about the customer
  reference. (D) UI conventions are not database constraints.
refs:
  - Referential integrity
  - ISC U1-W4
---
id: ISC-MCQ-DATA-0022
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: OLTP vs. Analytical Systems
stem: >-
  Month-end analytical queries run directly against Northstar's live order-entry database are
  slowing customer transactions to a crawl. The standard architectural remedy is to:
options:
  - text: Delete historical data so queries run faster
    key: false
  - text: Extract data to a separate data warehouse structured for analysis, and point reporting there
    key: true
  - text: Ask analysts to run queries only at night, permanently
    key: false
  - text: Denormalize the live transactional database into star schemas
    key: false
explanation: >-
  OLTP systems are optimized for many small transactions; analytical workloads belong in a separate
  warehouse (dimensional/star structures) fed by ETL, isolating reporting load from operations. (A)
  destroys the historical data analysis needs and creates retention problems. (C) is a scheduling
  workaround, not an architecture — it caps analysis capacity and fails as data grows. (D) encodes
  the misconception that you restructure the LIVE system; denormalizing the transactional database
  degrades transaction processing and update integrity.
refs:
  - OLTP vs. OLAP; data warehouse
  - ISC U1-W4
---
id: ISC-MCQ-DATA-0023
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: ETL Controls
stem: >-
  During the nightly ETL load from the job-cost system to the data warehouse, which control set MOST
  directly addresses the risk that records are dropped or altered in transformation?
options:
  - text: >-
      Batch control totals and record counts reconciled at each stage, with an exception/error log
      that is reviewed and resolved
    key: true
  - text: A strong password on the warehouse administrator account
    key: false
  - text: Purchasing more storage for the warehouse
    key: false
  - text: Restricting the warehouse to read-only for all users
    key: false
explanation: >-
  Completeness/accuracy through a pipeline is controlled with stage-to-stage reconciliation of
  counts and control totals plus managed exception handling. (B) access control protects against
  unauthorized change, not transformation errors in the pipeline itself. (C) capacity is an
  availability concern, irrelevant to dropped records. (D) read-only access for consumers protects
  data after it lands but does nothing about what the ETL job dropped on the way in.
refs:
  - ETL completeness controls
  - ISC U1-W4
