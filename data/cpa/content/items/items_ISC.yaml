id: ISC-MCQ-DATA-0027
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Information Systems and Data Management
topic: Data Lakes & Emerging Architectures
stem: >-
  A CFO proposes dumping all raw operational, IoT-sensor, and document data into a low-cost central
  repository with schema applied only when data is read, to enable future analytics. Which statement
  about this architecture and its PRIMARY governance risk is most accurate?
options:
  - text: It is a data warehouse, and the primary risk is that schema-on-write is too flexible
    key: false
  - text: >-
      It is a data lake (schema-on-read); without cataloging, ownership, and quality controls it
      degrades into an ungoverned 'data swamp' of unusable, potentially sensitive data
    key: true
  - text: It is an OLTP system, and the primary risk is transaction locking
    key: false
  - text: It is a blockchain, and the primary risk is proof-of-work energy cost
    key: false
explanation: >-
  Storing raw, multi-format data with schema-on-read defines a data lake; its characteristic
  governance failure is the data swamp — no catalog, no owners, unknown quality, and sensitive data
  with no classification or access rules. (A) reverses the concepts: warehouses use schema-on-WRITE
  and curated structures, and rigidity (not flexibility) is their trade-off. (C) an OLTP system is
  the opposite: highly structured, transaction-optimized. (D) is a category error — nothing
  described involves distributed ledgers.
refs:
  - Data lake vs. warehouse; data swamp risk
  - ISC U1-W4
