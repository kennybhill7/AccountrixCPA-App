id: ISC-MCQ-ITGC-0007
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: IT General Controls
stem: >-
  A reviewer classifies a control described as 'all changes to the job-cost application must be
  tested and approved before release to production.' Under the standard ITGC domains, this control
  belongs to:
options:
  - text: Program change management
    key: true
  - text: Access to programs and data
    key: false
  - text: Computer operations
    key: false
  - text: Program development
    key: false
explanation: >-
  Testing and approving modifications to an existing application before release is the
  change-management domain. (B) encodes the misconception that everything touching production is
  'access' — access controls govern who can log in and what they can do, not how changes are
  authorized. (C) operations covers scheduling, backups, and incident handling of running systems.
  (D) program development governs building NEW systems; changing an existing one is change
  management.
refs:
  - ITGC domains
  - ISC U1-W2
