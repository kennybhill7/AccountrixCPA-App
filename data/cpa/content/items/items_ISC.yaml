id: ISC-MCQ-TSCR-0039
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Processing Integrity vs. Availability
stem: >-
  A billing platform's nightly batch job silently dropped 2% of usage records last quarter, so
  invoices were incomplete — though the system was online 99.99% of the time. Which trust services
  category is implicated?
options:
  - text: Availability, because a batch job failed
    key: false
  - text: Processing integrity, because processing was not complete and accurate
    key: true
  - text: Privacy, because customer invoices were involved
    key: false
  - text: Confidentiality, because usage data was lost
    key: false
explanation: >-
  Processing integrity addresses whether processing is complete, valid, accurate, timely, and
  authorized — dropped records violate completeness/accuracy even with perfect uptime. (A) encodes
  the misconception that any batch failure is availability; the SYSTEM was available — its output
  was wrong. (C) privacy concerns collection/use/disclosure of PERSONAL information, not billing
  accuracy. (D) confidentiality concerns unauthorized disclosure; nothing was disclosed — data was
  dropped.
refs:
  - TSC processing integrity
  - ISC U2-W2
---
id: ISC-MCQ-TSCR-0040
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Confidentiality vs. Privacy
stem: >-
  A SOC 2 candidate handles two data sets: (1) customers' proprietary pricing models covered by
  NDAs, and (2) personal information of customers' employees collected for benefits administration.
  How do the trust services categories map?
options:
  - text: Pricing models → confidentiality; employees' personal information → privacy
    key: true
  - text: Both → privacy, because both are sensitive
    key: false
  - text: Both → confidentiality, because privacy applies only to healthcare entities
    key: false
  - text: Pricing models → privacy; personal information → confidentiality
    key: false
explanation: >-
  Confidentiality covers information designated as confidential (business data, NDAs); privacy
  applies specifically to PERSONAL information and the commitments around its collection, use,
  retention, disclosure, and disposal. (B) encodes the 'sensitive = privacy' misconception — privacy
  is scoped to personal information, not all sensitive data. (C) invents a healthcare limitation
  that doesn't exist. (D) reverses the two categories.
refs:
  - Confidentiality vs. privacy
  - ISC U2-W2
