id: ISC-MCQ-TSCR-0043
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Points of Focus
stem: >-
  During SOC 2 readiness, a controller worries the company must implement every 'point of focus'
  listed under each common criterion. The service auditor's BEST clarification is:
options:
  - text: Correct — every point of focus is a required control that must exist
    key: false
  - text: Points of focus apply only to privacy engagements
    key: false
  - text: Points of focus replace the criteria when they conflict
    key: false
  - text: >-
      Points of focus are illustrative considerations that help evaluate whether a criterion is met;
      the entity need not address each one if the criterion is otherwise satisfied
    key: true
explanation: >-
  Points of focus are guidance — characteristics that MAY be relevant when evaluating a criterion.
  The opinion is on the criteria, not on point-by-point compliance. (A) encodes the checklist
  misconception that turns guidance into requirements. (B) they exist across the criteria, not just
  privacy. (C) inverts the hierarchy — criteria always govern; points of focus never override them.
refs:
  - TSC points of focus
  - ISC U2-W2
