id: ISC-MCQ-GOVN-0001
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: IT Governance
stem: >-
  The board of Meridian Building Group approves a three-year IT strategy and a risk-appetite
  statement, then delegates system selection and project execution to the CIO's team. In IT
  governance terms, the board is performing which set of activities?
options:
  - text: Evaluate, direct, and monitor — governance activities
    key: true
  - text: Plan, build, run, and monitor — management activities
    key: false
  - text: Design and operation of application controls
    key: false
  - text: Day-to-day IT service management under ITIL
    key: false
explanation: >-
  Governance (per COBIT) is the board-level Evaluate-Direct-Monitor loop: set direction, approve
  strategy and risk appetite, and monitor outcomes. (B) encodes the misconception that governance
  and management are the same layer — plan/build/run/monitor is what management (the CIO's team)
  does. (C) confuses strategic oversight with control design, an operational task. (D) confuses
  governance with ITIL service management, which is an operations framework, not board oversight.
refs:
  - COBIT 2019 — Governance vs. Management Objectives
  - ISC U1-W1
---
id: ISC-MCQ-GOVN-0002
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: IT Governance
stem: >-
  Northstar Services wants a single framework that links enterprise goals to IT goals and covers
  governance and management of enterprise IT end-to-end — not just cybersecurity or
  financial-reporting controls. Which framework best fits?
options:
  - text: NIST Cybersecurity Framework
    key: false
  - text: COSO Internal Control — Integrated Framework
    key: false
  - text: COBIT
    key: true
  - text: ITIL
    key: false
explanation: >-
  COBIT is the end-to-end governance-and-management framework for enterprise IT, explicitly
  cascading enterprise goals to IT (alignment) goals. (A) encodes the misconception that any IT
  framework is interchangeable — NIST CSF is scoped to cybersecurity risk
  (Identify/Protect/Detect/Respond/Recover), not enterprise IT governance. (B) is entity-level
  internal control over reporting/operations/compliance, not IT-specific governance. (D) ITIL is IT
  service management (incident, change, service delivery), an operational subset.
refs:
  - COBIT 2019 Framework
  - NIST CSF 2.0
  - ISC U1-W1
