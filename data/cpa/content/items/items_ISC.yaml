id: ISC-MCQ-CYBR-0048
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Zero Trust
stem: >-
  A firm's security model grants full internal-network access to any device that connects from
  inside the office ('trusted zone'). A consultant recommends zero trust. Which change BEST reflects
  the zero-trust model?
options:
  - text: >-
      A taller perimeter: stronger firewall rules at the office boundary, with the interior
      unchanged
    key: false
  - text: Trusting all traffic that originates from company-owned devices
    key: false
  - text: Removing authentication for internal apps to reduce friction
    key: false
  - text: >-
      Authenticate and authorize every access request continuously — per user, per device, per
      resource — regardless of network location
    key: true
explanation: >-
  Zero trust replaces location-based trust ('inside = safe') with continuous verification of
  identity, device posture, and authorization for each resource request. (A) encodes the perimeter
  misconception zero trust exists to fix — a harder shell with a soft interior. (B) device ownership
  is not trust; compromised corporate devices are a primary attack path. (C) is the opposite of the
  model — zero trust adds verification, it never removes authentication.
refs:
  - Zero-trust architecture
  - ISC U2-W3
