id: ISC-MCQ-CYBR-0045
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: Social Engineering / BEC
stem: >-
  Northstar's AP clerk receives an urgent email appearing to come from the CFO, instructing an
  immediate $85,000 wire to a 'new subcontractor' and demanding secrecy. Which control MOST directly
  defeats this attack?
options:
  - text: >-
      Out-of-band verification — confirming any payment-instruction change with the requester by a
      known phone number before release
    key: true
  - text: Stronger password complexity requirements for the clerk
    key: false
  - text: Full-disk encryption on the clerk's laptop
    key: false
  - text: Increasing the email server's storage quota
    key: false
explanation: >-
  This is business email compromise, a social-engineering attack on the payment process; the
  defeating control is procedural — independent, out-of-band confirmation of payment instructions
  using known contact details. (B) encodes the misconception that authentication controls stop
  social engineering; no password was attacked. (C) disk encryption protects a stolen device,
  irrelevant here. (D) is a red-herring capacity item with no control value.
refs:
  - BEC; social engineering controls
  - ISC U2-W3
