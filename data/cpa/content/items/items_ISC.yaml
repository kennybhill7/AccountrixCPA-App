id: ISC-MCQ-BCDR-0056
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: RPO Analysis
stem: >-
  A firm backs up its estimating database once nightly at 11:00 p.m. Management has declared a
  recovery point objective (RPO) of 4 hours for this system. A disk failure at 3:00 p.m. would lose
  all data entered since the prior 11:00 p.m. backup. Which conclusion is correct?
options:
  - text: The RPO is met because backups run every day without fail
    key: false
  - text: The failure is a recovery time objective (RTO) problem, not an RPO problem
    key: false
  - text: >-
      The 4-hour RPO cannot be met — up to 16 hours of data would be lost — so the firm needs more
      frequent backups or continuous replication
    key: true
  - text: The RPO should be redefined as 24 hours so the current backups comply
    key: false
explanation: >-
  RPO is maximum tolerable DATA loss measured in time. Nightly backups mean a worst-case loss
  approaching 24 hours (16 hours in this scenario: 11 p.m. to 3 p.m.), far beyond the 4-hour RPO;
  meeting it requires intra-day backups or replication. (A) encodes the reliability misconception —
  consistent daily backups still leave a 24-hour exposure window. (B) confuses the two objectives:
  RTO is downtime duration; lost transactions are RPO. (D) reverses the logic — objectives are set
  by business impact (the BIA), then capabilities are built to meet them, not defined down to match
  current practice.
refs:
  - RPO vs. RTO
  - ISC U2-W4
