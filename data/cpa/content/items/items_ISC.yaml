id: ISC-MCQ-CYBR-0051
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Encryption & Key Management
stem: >-
  A firm encrypts backups with a strong algorithm but stores the encryption keys in the same cloud
  folder as the encrypted backup files, readable by all IT staff. The PRIMARY problem is:
options:
  - text: The algorithm should be replaced with a proprietary secret algorithm
    key: false
  - text: Encrypting backups is unnecessary in the first place
    key: false
  - text: >-
      Key management failure — co-locating keys with ciphertext and over-broad key access defeats
      the encryption's protection
    key: true
  - text: Backups should never be stored in the cloud
    key: false
explanation: >-
  Encryption is only as strong as its key management: anyone who obtains the folder gets both
  ciphertext and key, and every IT employee can decrypt. Keys must be stored separately (KMS/HSM)
  with restricted, logged access. (A) encodes security-through-obscurity — proprietary secret
  algorithms are weaker than vetted public ones. (B) abandons a needed control instead of fixing its
  implementation. (D) mislocates the issue; cloud storage is fine with proper key separation.
refs:
  - Encryption and key management
  - ISC U2-W3
