id: ISC-MCQ-CYBR-0046
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: Incident Response — Containment
stem: >-
  An analyst confirms ransomware is actively spreading from one workstation across the network. The
  IMMEDIATE next step in the incident-response life cycle is:
options:
  - text: Write the lessons-learned report
    key: false
  - text: Contain the incident — isolate the infected machine and affected segments from the network
    key: true
  - text: Immediately pay the ransom
    key: false
  - text: Restore all systems from backup while the malware is still active
    key: false
explanation: >-
  After detection/analysis confirms an active incident, containment comes next — stop the spread by
  isolating affected systems. (A) lessons learned is the FINAL phase. (C) paying is a business/legal
  decision, never the reflex 'next step,' and doesn't stop active spread. (D) encodes a sequencing
  error — recovery before eradication just re-infects restored systems.
refs:
  - Incident response life cycle
  - ISC U2-W3
  - NIST SP 800-61
