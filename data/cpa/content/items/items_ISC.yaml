id: ISC-MCQ-CYBR-0047
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Defense in Depth
stem: >-
  A CISO argues that because the company bought a 'next-generation firewall,' additional controls
  like endpoint protection, MFA, and log monitoring are redundant spending. The BEST rebuttal is
  grounded in which principle?
options:
  - text: Zero-day tolerance — modern firewalls cannot be breached
    key: false
  - text: >-
      Defense in depth — layered, overlapping controls so that failure or bypass of any single
      control does not expose the whole environment
    key: true
  - text: Security through obscurity — hiding the network design is sufficient
    key: false
  - text: Single point of accountability — one control makes audits simpler
    key: false
explanation: >-
  Defense in depth assumes any single control can fail or be bypassed (phishing sails past a
  firewall entirely), so protection is layered: network, endpoint, identity, monitoring. (A) is a
  false premise — every control has bypasses and vulnerabilities. (C) obscurity is explicitly
  rejected as a primary defense. (D) encodes the misconception that audit convenience is a security
  design principle; concentrating everything in one control creates a single point of failure.
refs:
  - Defense in depth
  - ISC U2-W3
