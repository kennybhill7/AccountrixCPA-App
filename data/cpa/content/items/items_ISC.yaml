id: ISC-MCQ-TSCR-0042
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Processing Integrity Attributes
stem: 'Under the trust services criteria, processing integrity means system processing is:'
options:
  - text: Complete, valid, accurate, timely, and authorized
    key: true
  - text: Encrypted, redundant, and monitored
    key: false
  - text: Fast, inexpensive, and scalable
    key: false
  - text: Backed up, patched, and firewalled
    key: false
explanation: >-
  The definition is the five attributes: complete, valid, accurate, timely, authorized. (B) mixes
  security and availability mechanisms — controls that may SUPPORT integrity but are not its
  definition. (C) lists performance/economic qualities outside assurance criteria entirely. (D)
  lists specific security/operations controls, again mechanisms rather than the defined attributes.
refs:
  - TSC processing integrity definition
  - ISC U2-W2
