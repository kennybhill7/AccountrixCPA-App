id: ISC-MCQ-BCDR-0060
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Security, Confidentiality and Privacy
topic: DR Plan Testing
stem: >-
  A CFO wants proof the firm can actually meet its declared 4-hour RTO for core systems, but the COO
  refuses any test that risks disrupting live production. Which testing approach BEST satisfies both
  constraints?
options:
  - text: A tabletop exercise where the team talks through the disaster scenario in a conference room
    key: false
  - text: A checklist review confirming the plan document is up to date
    key: false
  - text: >-
      A parallel/simulation test — actually failing over to and running recovery systems while
      production continues operating undisturbed
    key: true
  - text: A full-interruption test that shuts down production to force real failover
    key: false
explanation: >-
  A parallel (simulation) test activates the recovery environment and processes test workloads
  alongside untouched production — the strongest evidence of real recovery capability, including
  timing, without production risk. (A) tabletop exercises validate decisions and roles but never
  touch technology, so they cannot prove a 4-hour technical RTO. (B) a document review proves even
  less — currency, not capability. (D) provides the best evidence but violates the COO's constraint
  by design; it is the option 'proof at any cost' would pick.
refs:
  - DR testing hierarchy
  - ISC U2-W4
