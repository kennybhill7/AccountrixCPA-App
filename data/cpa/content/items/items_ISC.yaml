id: ISC-MCQ-GOVN-0005
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: Third-Party & Outsourcing Governance
stem: >-
  Northstar Services outsources hosted job-cost processing to a cloud vendor. Which contract
  provision MOST directly preserves Northstar's ability to obtain assurance over the vendor's
  controls?
options:
  - text: A most-favored-customer pricing clause
    key: false
  - text: A clause requiring the vendor to use agile development
    key: false
  - text: An automatic renewal clause
    key: false
  - text: A right-to-audit clause and required delivery of periodic SOC reports
    key: true
explanation: >-
  Assurance over an outsourced provider comes from audit rights and/or independent SOC reporting —
  the contract must secure one or both. (A) is commercial pricing protection, not assurance. (B)
  encodes the misconception that a development methodology provides control assurance; it does not.
  (C) is a convenience term that, if anything, weakens leverage over the vendor.
refs:
  - Vendor risk management
  - ISC U1-W1
  - ISC U2-W1
