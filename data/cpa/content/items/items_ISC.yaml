id: ISC-MCQ-BCDR-0058
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Recovery Site Selection
stem: >-
  The BIA sets a 2-hour RTO for a firm's customer-facing scheduling platform. Which recovery
  arrangement is the MINIMUM that can realistically meet this target?
options:
  - text: >-
      A cold site — empty space with power and HVAC where hardware would be delivered after a
      disaster
    key: false
  - text: Relying on cyber insurance to reimburse downtime losses
    key: false
  - text: >-
      A warm site with hardware installed but requiring roughly a day to load current data and
      configurations
    key: false
  - text: >-
      A hot site (or cloud active/standby replication) kept current with near-real-time data, ready
      for rapid failover
    key: true
explanation: >-
  A 2-hour RTO demands infrastructure that is already running and current — a hot site or cloud
  failover with replicated data. (A) cold sites take days-to-weeks (procure, install, configure,
  restore). (B) encodes the risk-transfer misconception: insurance reimburses money; it restores
  nothing and satisfies no RTO. (C) a day-long activation misses a 2-hour target by an order of
  magnitude.
refs:
  - Hot/warm/cold sites
  - ISC U2-W4
