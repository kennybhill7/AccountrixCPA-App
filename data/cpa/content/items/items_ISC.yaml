id: ISC-MCQ-SOCE-0031
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Parties & Subservice Organizations
stem: >-
  A payroll service organization uses a third-party cloud data center. The payroll company's SOC 1
  report describes the data center's controls as excluded, listing instead the controls the payroll
  company expects the data center to have. This treatment is called:
options:
  - text: The inclusive method
    key: false
  - text: A scope limitation requiring a disclaimer of opinion
    key: false
  - text: The carve-out method, identifying complementary subservice organization controls
    key: true
  - text: A qualified opinion on the data center
    key: false
explanation: >-
  Carve-out excludes the subservice organization's controls from the description and tests, while
  identifying the complementary subservice organization controls (CSOCs) assumed to be in place. (A)
  is the opposite: inclusive method brings the subservice org's controls INTO the description and
  testing. (B) encodes the misconception that carve-out is an audit problem — it is a permitted
  presentation method, not a scope limitation. (D) no opinion is being expressed on the data center
  at all under carve-out.
refs:
  - Carve-out vs. inclusive method
  - ISC U2-W1
---
id: ISC-MCQ-SOCE-0032
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Carve-Out Implications for Users
stem: >-
  A user entity relies on a payroll service organization whose SOC 1 Type 2 report carves out its
  cloud-hosting subservice organization. What must the user entity (and its auditor) do about the
  hosting risk?
options:
  - text: Nothing — the payroll SOC 1 opinion automatically covers the carved-out data center
    key: false
  - text: >-
      Obtain assurance over the subservice organization separately (e.g., its own SOC report) or
      otherwise evaluate whether the identified complementary subservice organization controls are
      in place
    key: true
  - text: Refuse to rely on any part of the payroll SOC 1 report
    key: false
  - text: Require the payroll company to insource its hosting before year-end
    key: false
explanation: >-
  Under carve-out, the service auditor's opinion does NOT cover the subservice organization; users
  must bridge the gap — typically by obtaining the subservice org's own SOC report or performing
  other procedures over the CSOCs. (A) encodes the coverage misconception that is the whole point of
  carve-out — coverage stops at the carve-out line. (C) overcorrects: the report remains valid
  evidence for the controls it does cover. (D) is an unrealistic business demand, not an assurance
  procedure.
refs:
  - CSOCs; user auditor responsibilities
  - ISC U2-W1
---
id: ISC-MCQ-SOCE-0033
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Complementary User-Entity Controls
stem: >-
  A service organization's SOC 1 report lists as a complementary user-entity control (CUEC): 'User
  entities are responsible for restricting who can submit payroll changes.' A user entity never
  restricted submission access, and a fraudulent pay-rate change was processed. Which statement is
  correct?
options:
  - text: The service organization's controls failed, because the fraud flowed through its system
    key: false
  - text: The service auditor should have caught the user's weakness during the SOC examination
    key: false
  - text: A CUEC breakdown is impossible when the SOC opinion is unqualified
    key: false
  - text: >-
      The control failure is the user entity's: the SOC report's control objectives are achieved
      only if user entities implement the stated CUECs
    key: true
explanation: >-
  CUECs are controls the service organization ASSUMES user entities will operate; the SOC opinion is
  conditioned on them. Failing to implement a CUEC is a user-entity control failure, not a
  service-organization failure. (A) encodes the misconception that the processor owns all risk in
  its pipeline — it explicitly disclaimed this piece via the CUEC. (B) service auditors examine the
  service organization; they do not audit each user's controls. (C) an unqualified SOC opinion says
  nothing about whether any particular user actually implemented the CUECs.
refs:
  - CUECs
  - ISC U2-W1
---
id: ISC-MCQ-SOCE-0034
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: SOC Report Contents
stem: Which element appears in a SOC 1 Type 2 report but NOT in a SOC 1 Type 1 report?
options:
  - text: Management's description of the service organization's system
    key: false
  - text: Management's written assertion
    key: false
  - text: The service auditor's description of tests of controls and results for the period
    key: true
  - text: The service auditor's opinion
    key: false
explanation: >-
  Both types contain the system description, management's assertion, and an opinion; only a Type 2
  adds the detailed tests of operating effectiveness and their results over the period. (A), (B),
  and (D) all encode the misconception that Type 1 reports are missing basic elements — Type 1 has
  all three; what it lacks is testing of operating effectiveness over time.
refs:
  - SOC report components
  - ISC U2-W1
