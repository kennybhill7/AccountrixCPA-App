id: ISC-MCQ-SOCE-0037
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Coverage Gaps & Bridge Letters
stem: >-
  A user entity's fiscal year ends December 31. Its service organization's SOC 1 Type 2 report
  covers October 1 of the prior year through September 30. How should the user auditor address
  October–December?
options:
  - text: Ignore the gap; three months is automatically immaterial
    key: false
  - text: >-
      Obtain a bridge (gap) letter from the service organization about changes since September 30,
      evaluate any changes, and perform additional procedures as needed for the stub period
    key: true
  - text: Insist the service auditor reissue the same report dated December 31
    key: false
  - text: Treat the entire year as unaudited and disclaim an opinion
    key: false
explanation: >-
  The standard response to a coverage gap is a bridge letter (management's statement of whether
  controls changed after the period), evaluation of any identified changes, and supplemental
  procedures (inquiry, testing) proportionate to the gap and risk. (A) encodes the misconception
  that short gaps need no consideration — the auditor must assess, not assume. (C) a report cannot
  simply be redated; it covers the period tested. (D) is a massive overreaction — a manageable
  evidence gap does not force a disclaimer.
refs:
  - Bridge letters; SOC coverage gaps
  - ISC U2-W1
