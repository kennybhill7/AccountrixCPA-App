id: ISC-MCQ-CYBR-0049
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Incident Response Sequencing
stem: >-
  Order these incident-response activities per the standard life cycle: (1) remove the malware and
  close the exploited vulnerability; (2) restore systems to normal operation; (3) develop the IR
  plan and train the team; (4) triage alerts to confirm an incident; (5) isolate affected systems.
options:
  - text: 3, 4, 5, 1, 2
    key: true
  - text: 4, 3, 5, 2, 1
    key: false
  - text: 3, 5, 4, 1, 2
    key: false
  - text: 5, 4, 3, 1, 2
    key: false
explanation: >-
  The life cycle runs Preparation (3) → Detection & Analysis (4) → Containment (5) → Eradication (1)
  → Recovery (2) → Lessons Learned. (B) puts preparation after detection — preparation by definition
  precedes incidents — and restores before eradicating, which re-infects clean systems. (C) contains
  before confirming an incident exists, disrupting operations on unverified alerts. (D) also
  isolates before any analysis and places preparation mid-incident.
refs:
  - NIST SP 800-61 IR life cycle
  - ISC U2-W3
