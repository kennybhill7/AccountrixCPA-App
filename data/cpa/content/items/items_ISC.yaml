id: ISC-MCQ-ITGC-0008
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Authentication
stem: >-
  A payroll clerk signs in with a password and then must approve a push notification on a registered
  phone. A second system requires a password plus answers to security questions. Which statement is
  correct?
options:
  - text: Both systems use multifactor authentication
    key: false
  - text: >-
      Only the first system uses multifactor authentication; a password plus security questions is
      two instances of one factor (something you know)
    key: true
  - text: Neither system uses multifactor authentication because biometrics are required for MFA
    key: false
  - text: The second system is stronger because security questions cannot be phished
    key: false
explanation: >-
  MFA requires factors from DIFFERENT categories: something you know, something you have, something
  you are. Password (know) + registered phone (have) = two factors. Password + security questions =
  know + know = single-factor, twice. (A) encodes the misconception that two challenges equal two
  factors. (C) encodes the misconception that biometrics are mandatory — any two distinct categories
  qualify. (D) is backwards; security-question answers are notoriously guessable and phishable.
refs:
  - Authentication factors
  - ISC U1-W2
---
id: ISC-MCQ-ITGC-0009
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Authorization & Least Privilege
stem: >-
  A newly hired AP clerk at Meridian Building Group was granted the same access profile as her
  supervisor 'to save setup time,' including vendor-master maintenance and payment release. The BEST
  characterization of the control failure is:
options:
  - text: >-
      A violation of the least-privilege principle in user provisioning, creating a
      segregation-of-duties conflict
    key: true
  - text: A failure of physical access controls
    key: false
  - text: An acceptable practice as long as her password is strong
    key: false
  - text: A detective control weakness only
    key: false
explanation: >-
  Provisioning should grant only the access a role requires (least privilege); giving a clerk
  vendor-master AND payment-release rights combines incompatible duties (can create a vendor and pay
  it). (B) confuses logical access with physical access. (C) encodes the misconception that
  authentication strength compensates for excessive authorization — a strong password just securely
  authenticates an over-privileged user. (D) mislabels the failure: provisioning is a preventive
  control; the failure is preventive, though a detective access review could catch it later.
refs:
  - Least privilege / RBAC
  - ISC U1-W2
---
id: ISC-MCQ-ITGC-0010
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: Access Deprovisioning
stem: >-
  A project manager left Northstar Services in March; in June his network account was still active
  and had been used remotely. Which control, operating properly, would have DETECTED this condition?
options:
  - text: A firewall
    key: false
  - text: Data-entry limit checks
    key: false
  - text: A periodic user-access review reconciling active accounts to current HR records
    key: true
  - text: Encrypting data at rest
    key: false
explanation: >-
  A periodic access review compares active accounts against the current employee roster and flags
  terminated users — a detective control for deprovisioning failures. (A) firewalls filter network
  traffic; a valid account passes right through. (B) is an application input control, irrelevant to
  account lifecycle. (D) encryption protects data confidentiality but does nothing about a live
  authorized credential.
refs:
  - User access reviews
  - ISC U1-W2
---
id: ISC-MCQ-ITGC-0011
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Application Controls — Input
stem: >-
  A timekeeping application rejects any weekly timesheet entry over 100 hours for one employee. This
  input control is BEST described as a:
options:
  - text: Validity check against a master file
    key: false
  - text: Completeness check on the batch
    key: false
  - text: Limit (reasonableness) check
    key: true
  - text: Check digit on the employee number
    key: false
explanation: >-
  A limit/reasonableness check tests whether a numeric value falls within a plausible range — 100
  hours/week is the ceiling here. (A) encodes the misconception that all edits are lookups; a
  validity check compares input to authorized values (e.g., a real employee ID), not to a numeric
  bound. (B) completeness ensures all records/fields are present, not that values are reasonable.
  (D) a check digit detects transcription errors in identification numbers, not out-of-range
  quantities.
refs:
  - Application input controls
  - ISC U1-W2
---
id: ISC-MCQ-ITGC-0012
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Control Classification
stem: >-
  Classify these three controls: (1) a firewall blocking unauthorized inbound traffic; (2) weekly
  review of failed-login logs; (3) restoring a corrupted file from last night's backup.
options:
  - text: 1 detective; 2 preventive; 3 corrective
    key: false
  - text: 1 preventive; 2 detective; 3 corrective
    key: true
  - text: 1 preventive; 2 corrective; 3 detective
    key: false
  - text: 1 corrective; 2 detective; 3 preventive
    key: false
explanation: >-
  Preventive controls stop errors/attacks before they occur (firewall). Detective controls identify
  events after they occur (log review). Corrective controls fix the damage (restoring from backup).
  (A) swaps the firewall and log review — a log review can only find what already happened, it
  prevents nothing. (C) encodes the misconception that fixing something you found makes the review
  corrective; the review detects, the restore corrects. (D) reverses the whole taxonomy.
refs:
  - Preventive/detective/corrective controls
  - ISC U1-W2
---
id: ISC-MCQ-ITGC-0013
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Information Systems and Data Management
topic: Change Management
stem: >-
  During a production outage at 2 a.m., an engineer applied an emergency code fix directly to the
  live job-cost system without prior approval. Which control package makes emergency changes
  acceptable rather than a deficiency?
options:
  - text: >-
      Emergency changes are never acceptable; the system must stay down until the full change
      process completes
    key: false
  - text: >-
      Automatic logging of the change, documented after-the-fact approval within a defined window,
      and independent post-implementation review of the fix
    key: true
  - text: Requiring the engineer to email the CIO the next week if he remembers
    key: false
  - text: Granting all senior engineers permanent production access so approvals are unnecessary
    key: false
explanation: >-
  Standard practice permits emergency changes when compensating controls exist: the change is logged
  automatically, formally approved retroactively within a defined period, and independently reviewed
  afterward. (A) encodes the rigidity misconception — availability objectives justify an emergency
  path, provided it is controlled. (C) is an uncontrolled, unenforced notification, not a control.
  (D) encodes the misconception that removing the control removes the risk; standing production
  access for developers is itself a classic ITGC deficiency.
refs:
  - Emergency change procedures
  - ISC U1-W2
  - ISC U1-W3
