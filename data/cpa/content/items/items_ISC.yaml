id: ISC-MCQ-SOCE-0029
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Type 1 vs. Type 2
stem: >-
  A user auditor plans to rely on a service organization's controls over transaction processing for
  the ENTIRE year under audit. Which SOC report provides the needed evidence?
options:
  - text: A Type 1 report as of the balance-sheet date
    key: false
  - text: A Type 1 report as of the first day of the year
    key: false
  - text: Either type, because they provide identical assurance
    key: false
  - text: A Type 2 report covering the period, because it tests operating effectiveness over time
    key: true
explanation: >-
  Type 2 reports opine on design AND operating effectiveness over a specified period, which is what
  control reliance for a period requires. (A) and (B) encode the point-in-time misconception: a Type
  1 addresses design/implementation at a single date only — it says nothing about whether controls
  OPERATED all year. (C) is false; the assurance levels differ fundamentally — operating
  effectiveness is only tested in a Type 2.
refs:
  - Type 1 vs. Type 2 SOC reports
  - ISC U2-W1
