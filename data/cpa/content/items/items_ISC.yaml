id: ISC-MCQ-BCDR-0057
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Security, Confidentiality and Privacy
topic: Business Impact Analysis
stem: >-
  Before selecting recovery strategies, a continuity team catalogs business processes, estimates the
  financial and operational impact of downtime for each over increasing durations, and identifies
  dependencies. This activity is the:
options:
  - text: Penetration test
    key: false
  - text: >-
      Business impact analysis (BIA), which drives the RTO/RPO targets that recovery strategies must
      satisfy
    key: true
  - text: Disaster declaration
    key: false
  - text: Tabletop exercise
    key: false
explanation: >-
  The BIA quantifies what downtime costs per process and surfaces dependencies; its outputs
  (criticality rankings, RTOs, RPOs) are the requirements that recovery-strategy selection must meet
  — which is why it comes first. (A) a pen test evaluates security defenses, not downtime impact.
  (C) disaster declaration is the moment a plan is INVOKED during an event. (D) a tabletop exercise
  TESTS a plan that already exists; the scenario describes building the analysis before the plan.
refs:
  - Business impact analysis
  - ISC U2-W4
