id: ISC-MCQ-TSCR-0044
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Mapping Controls to Criteria
stem: >-
  A service organization encrypts customer data files at rest and tightly manages the encryption
  keys. In a SOC 2 covering security, availability, and confidentiality, how does this ONE control
  map to the criteria?
options:
  - text: It maps only to availability, because encrypted data is always recoverable
    key: false
  - text: >-
      It cannot be used for more than one criterion; a duplicate control must be built for each
      category
    key: false
  - text: >-
      It can support multiple criteria simultaneously — e.g., logical access/data protection under
      the security common criteria and protection of confidential information under confidentiality
    key: true
  - text: It maps to processing integrity, because encryption guarantees accurate processing
    key: false
explanation: >-
  Controls map many-to-many against criteria: encryption at rest with key management is classic
  evidence for security common criteria (protection of data, logical access) AND for confidentiality
  commitments. (A) is backwards — encryption does nothing for availability, and lost keys actually
  create an availability risk. (B) encodes the one-control-one-criterion misconception; a single
  well-designed control routinely serves several criteria. (D) overstates encryption: it protects
  data from disclosure/alteration in storage but cannot make processing logic accurate.
refs:
  - Control-to-criteria mapping
  - ISC U2-W2
