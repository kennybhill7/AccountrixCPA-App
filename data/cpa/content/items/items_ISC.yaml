id: ISC-MCQ-DATA-0026
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Data Quality
stem: >-
  Northstar discovers the same customer exists in its billing master file five times with slightly
  different name spellings, causing understated concentration reports. This is PRIMARILY a failure
  of which data-quality dimension, and what is the standard remedy?
options:
  - text: Timeliness; refresh the file more often
    key: false
  - text: Completeness; add the missing customers
    key: false
  - text: Validity; the records violate field formats
    key: false
  - text: >-
      Uniqueness; deduplicate via matching rules and enforce a single golden record (master data
      management)
    key: true
explanation: >-
  Duplicate representations of one real-world entity violate uniqueness; the remedy is
  matching/merge rules and master data management to maintain one authoritative record. (A) encodes
  the misconception that stale data causes duplicates — refresh frequency won't merge them. (B) is
  the opposite problem; nothing is missing, there is too much. (C) each duplicate may be perfectly
  valid in format — validity checks won't catch semantically duplicate records.
refs:
  - Data quality dimensions; MDM
  - ISC U1-W4
