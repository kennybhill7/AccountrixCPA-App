id: ISC-MCQ-ITGC-0014
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: CIA Triad
stem: >-
  Ransomware encrypts a contractor's estimating database, and no one can retrieve project data until
  systems are restored. Which element of the CIA triad is PRIMARILY compromised?
options:
  - text: Confidentiality
    key: false
  - text: Authorization
    key: false
  - text: Availability
    key: true
  - text: Non-repudiation
    key: false
explanation: >-
  Ransomware's primary effect is denying access to data and systems — an availability loss. (A)
  encodes the misconception that encryption events are confidentiality events; unless data was also
  exfiltrated, nothing was disclosed. (B) authorization is an access-control concept, not a CIA
  element. (D) non-repudiation concerns proving who performed an action; it is not one of the CIA
  triad elements and is not the issue here.
refs:
  - CIA triad
  - ISC U1-W2
  - ISC U2-W3
---
id: ISC-MCQ-SDLC-0015
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Information Systems and Data Management
topic: Testing in the SDLC
stem: Before a new billing system goes live, who should perform user acceptance testing (UAT), and when?
options:
  - text: >-
      The business users who will operate the system, after system/integration testing and before
      implementation
    key: true
  - text: The developers who wrote the code, immediately after unit testing
    key: false
  - text: The external auditor, after the system is in production
    key: false
  - text: The vendor's sales team, during requirements definition
    key: false
explanation: >-
  UAT is the business users' confirmation that the system meets requirements in realistic scenarios;
  it follows system and integration testing and gates go-live. (B) encodes the misconception that
  developers can accept their own work — that is self-review; developers do unit testing, not
  acceptance. (C) auditors may review the process but do not perform UAT, and after go-live is too
  late to 'accept.' (D) sales has no acceptance role, and testing cannot precede a built system.
refs:
  - SDLC testing phases
  - ISC U1-W3
