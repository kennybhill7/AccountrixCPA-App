id: ISC-MCQ-CYBR-0053
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: Security Control Classification
stem: >-
  An intrusion detection system (IDS) that alerts the security team to suspicious traffic — but does
  not block it — is BEST classified as what type of control?
options:
  - text: Corrective
    key: false
  - text: Preventive
    key: false
  - text: Compensating
    key: false
  - text: Detective
    key: true
explanation: >-
  An IDS monitors and ALERTS — identifying events as or after they occur — the definition of a
  detective control. (B) encodes IDS/IPS confusion: an intrusion PREVENTION system blocks traffic
  inline and is preventive; detection-only is not. (A) corrective controls remediate damage (e.g.,
  restore from backup). (C) compensating controls substitute for a missing primary control; that's a
  role, not what an IDS inherently is.
refs:
  - IDS vs. IPS
  - ISC U2-W3
