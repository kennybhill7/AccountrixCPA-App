id: ISC-MCQ-CYBR-0054
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Security, Confidentiality and Privacy
topic: Application Attacks — SQL Injection
stem: >-
  Attackers extracted a service company's entire customer table by typing crafted text into the
  login form's username field, causing the database to execute the text as part of a query. Which
  vulnerability was exploited, and what is the PRIMARY fix?
options:
  - text: >-
      SQL injection; fix with input validation and parameterized queries/prepared statements (with a
      web application firewall as an additional layer)
    key: true
  - text: Cross-site scripting; fix by encrypting the database
    key: false
  - text: A DDoS attack; fix with more bandwidth
    key: false
  - text: Weak passwords; fix with a longer password policy
    key: false
explanation: >-
  User input concatenated into a query and executed by the database is SQL injection; the root-cause
  fix is parameterized queries/prepared statements plus input validation, with a WAF as defense in
  depth. (B) misidentifies the attack — XSS executes script in a victim's BROWSER, not queries in
  the database — and encryption at rest doesn't stop a query the app itself executes. (C) nothing
  here concerns traffic volume. (D) encodes the misconception that login-page attacks are always
  credential attacks; no password was guessed — the form field was a code path.
refs:
  - SQL injection; secure coding
  - ISC U2-W3
