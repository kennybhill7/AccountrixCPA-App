id: ISC-MCQ-SOCE-0030
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: SOC 3 Reports
stem: >-
  A cloud provider wants a report on its security controls that it can post publicly on its website
  for prospective customers. Which report is appropriate?
options:
  - text: SOC 1 Type 2, because it is the most detailed
    key: false
  - text: SOC 3, a general-use report
    key: true
  - text: SOC 2 Type 2, distributed without restriction
    key: false
  - text: An internal audit memo
    key: false
explanation: >-
  SOC 3 is the general-use trust-services report designed for unrestricted distribution (no detailed
  test results). (A) SOC 1 addresses ICFR-relevant controls and is restricted-use — wrong subject
  and wrong audience. (C) encodes the distribution misconception: SOC 2 reports are restricted-use
  (specified parties who understand the system); they are not for public posting. (D) an internal
  memo is not independent assurance.
refs:
  - SOC 3 general use
  - ISC U2-W1
