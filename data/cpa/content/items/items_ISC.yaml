id: ISC-MCQ-BCDR-0055
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: BCP vs. DRP
stem: >-
  What is the key distinction between a business continuity plan (BCP) and a disaster recovery plan
  (DRP)?
options:
  - text: >-
      BCP addresses continuing critical BUSINESS operations during disruption; DRP is the narrower
      IT-focused plan for restoring systems, applications, and data
    key: true
  - text: BCP is for natural disasters only; DRP is for cyberattacks only
    key: false
  - text: They are the same document with different covers
    key: false
  - text: DRP covers the whole business; BCP covers only IT
    key: false
explanation: >-
  BCP is the enterprise-wide plan for keeping critical business functions running (people,
  facilities, processes, communications); DRP is its IT component — restoring technology. (B)
  encodes a cause-based misconception; both plans are cause-agnostic. (C) understates real scope
  differences that drive different owners, testing, and content. (D) reverses the two scopes.
refs:
  - BCP vs. DRP
  - ISC U2-W4
