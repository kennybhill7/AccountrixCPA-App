id: ISC-MCQ-DATA-0024
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: Data Governance Roles
stem: >-
  A regional manager requests access to the full employee-compensation dataset. Under a
  data-governance model, who has the AUTHORITY to approve or deny the request?
options:
  - text: The database administrator, as the person who technically grants access
    key: false
  - text: Any user who already has access to the data
    key: false
  - text: The data owner accountable for the compensation data (e.g., the HR executive)
    key: true
  - text: The data steward, because stewards outrank owners
    key: false
explanation: >-
  Data owners are the accountable business executives who decide who may access their data and under
  what conditions; custodians then implement the decision. (A) encodes the classic owner/custodian
  confusion — the DBA is a custodian who EXECUTES approved grants but does not approve them. (B)
  access does not confer authority to share. (D) inverts the hierarchy: stewards manage data quality
  and definitions day-to-day on behalf of owners; they don't outrank them.
refs:
  - Data owner / custodian / steward
  - ISC U1-W4
