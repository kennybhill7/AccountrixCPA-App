id: ISC-MCQ-SOCE-0035
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Qualified SOC Opinions
stem: >-
  A user auditor receives a SOC 1 Type 2 report with a qualified opinion: controls over one
  objective — automated interest calculations — did not operate effectively. The user auditor's BEST
  response is to:
options:
  - text: Discard the entire report and treat the service organization as unaudited
    key: false
  - text: >-
      Assess whether the qualified area is relevant to the user's financial statements and, if so,
      respond with substantive procedures or testing of compensating controls over interest
      calculations
    key: true
  - text: Rely on the report in full, since most objectives were met
    key: false
  - text: Require the client to change service organizations before issuing the audit opinion
    key: false
explanation: >-
  A qualification is objective-specific: the auditor maps the failed objective to relevant
  assertions and designs a response (substantive testing, user-entity compensating controls) for
  that area, while still relying on unaffected areas. (A) over-rejects — the unqualified portions
  remain valid evidence. (C) under-responds by ignoring a directly relevant failure. (D) confuses an
  evidence problem with a business decision the auditor cannot impose.
refs:
  - Using SOC reports with modified opinions
  - ISC U2-W1
