id: ISC-MCQ-SOCE-0028
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: SOC Report Types
stem: >-
  Meridian Building Group outsources payroll processing to a service organization. Meridian's
  financial statement auditor wants assurance over the service organization's controls that affect
  Meridian's payroll balances. Which report is designed for this need?
options:
  - text: A SOC 1 report
    key: true
  - text: A SOC 2 report on security and availability
    key: false
  - text: A SOC 3 general-use report
    key: false
  - text: A PCI DSS attestation
    key: false
explanation: >-
  SOC 1 reports address controls at a service organization relevant to user entities' internal
  control over financial reporting — exactly what a user auditor needs for outsourced payroll. (B)
  encodes the misconception that SOC 2 is the universal report; it addresses trust services criteria
  (security, availability, etc.) for operational/compliance needs, not ICFR assertions. (C) SOC 3 is
  a marketing-oriented summary lacking the detail user auditors need. (D) PCI DSS is card-data
  compliance, unrelated to payroll ICFR.
refs:
  - AT-C 320; SOC 1 vs. SOC 2
  - ISC U2-W1
