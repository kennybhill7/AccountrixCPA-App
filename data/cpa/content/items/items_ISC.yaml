id: ISC-MCQ-GOVN-0004
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: IT Governance Bodies
stem: >-
  Meridian Building Group receives more system-project requests than it can fund. Which body is BEST
  positioned to prioritize competing IT projects against business strategy and approve resource
  allocation?
options:
  - text: The database administration team
    key: false
  - text: The external auditor
    key: false
  - text: The help desk manager
    key: false
  - text: The IT steering committee
    key: true
explanation: >-
  An IT steering committee — senior business and IT leadership — exists precisely to align the
  project portfolio with strategy, prioritize competing requests, and approve funding. (A) encodes
  the misconception that technical custodians set priorities; DBAs administer data platforms, they
  don't own portfolio decisions. (B) external auditors must remain independent and cannot make
  management decisions. (C) the help desk is an operational support function with no portfolio
  authority.
refs:
  - COBIT APO — Portfolio Management
  - ISC U1-W1
