id: ISC-MCQ-SOCE-0036
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Selecting the Right SOC Engagement
stem: >-
  Bluewater SaaS, a project-management platform, keeps losing enterprise deals because prospects'
  vendor-risk teams demand independent evidence about its security and availability controls. Which
  engagement should Bluewater pursue?
options:
  - text: A SOC 2 Type 2 examination on security and availability
    key: true
  - text: A SOC 1 Type 1 examination
    key: false
  - text: A financial statement audit
    key: false
  - text: An agreed-upon procedures report on its marketing claims
    key: false
explanation: >-
  Vendor-risk diligence about security/availability maps to SOC 2 on the relevant trust services
  categories, and Type 2 provides operating-effectiveness evidence buyers expect. (B) encodes SOC
  1/SOC 2 confusion — SOC 1 targets user ICFR, not security posture, and Type 1 lacks period
  coverage. (C) a financial statement audit says nothing about platform controls. (D) AUP procedures
  don't provide the recognized, criteria-based assurance vendor-risk teams request.
refs:
  - SOC 2 use cases
  - ISC U2-W1
  - ISC U2-W2
