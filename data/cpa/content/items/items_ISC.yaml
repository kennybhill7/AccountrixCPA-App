id: ISC-MCQ-TSCR-0038
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Trust Services Categories
stem: >-
  A company scoping its first SOC 2 asks which trust services category CANNOT be excluded. The
  correct answer is:
options:
  - text: Privacy, because regulators require it
    key: false
  - text: Availability, because customers care about uptime most
    key: false
  - text: Security, because the common criteria are required in every SOC 2 examination
    key: true
  - text: Processing integrity, because SOC 2 originated from transaction processing
    key: false
explanation: >-
  Security (the common criteria) is mandatory in every SOC 2; the other four categories —
  availability, processing integrity, confidentiality, privacy — are added based on commitments and
  user needs. (A) encodes the misconception that privacy is compulsory; it is optional unless
  personal-information commitments make it relevant. (B) availability is common but elective. (D)
  processing integrity is likewise elective; the historical origin claim is also wrong.
refs:
  - TSC — common criteria
  - ISC U2-W2
