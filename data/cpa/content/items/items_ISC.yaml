id: ISC-MCQ-GOVN-0003
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Information Systems and Data Management
topic: IT Organization & Segregation
stem: >-
  At a construction-services firm, the lead application developer also holds credentials that let
  her migrate her own code into the production payroll environment. No one else reviews the
  migrations. The PRIMARY control concern is:
options:
  - text: The developer may lack sufficient programming skill
    key: false
  - text: Inadequate segregation of duties between development and production migration
    key: true
  - text: The payroll application lacks input edit checks
    key: false
  - text: The firm has not adopted an agile methodology
    key: false
explanation: >-
  Developers should not move their own code to production; an independent function (change
  control/operations or an automated pipeline with independent approval) should migrate tested,
  approved code. This SoD failure lets unauthorized or erroneous code reach production undetected.
  (A) encodes the misconception that this is a competence issue — it is an access/authority issue
  regardless of skill. (C) is an application-control issue unrelated to the migration risk
  described. (D) encodes the misconception that methodology choice is a control; agile teams still
  require independent release controls.
refs:
  - ITGC — Program Change domain
  - ISC U1-W1
  - ISC U1-W2
