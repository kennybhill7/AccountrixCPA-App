id: ISC-MCQ-BCDR-0059
section: ISC
type: MCQ
difficulty: Easy
blueprint_area: Security, Confidentiality and Privacy
topic: Backup Strategies
stem: >-
  A firm takes a full backup every Sunday night and incremental backups every other night. The
  server fails Thursday morning. How many backup sets must be restored, in order?
options:
  - text: Two — the Sunday full plus Wednesday's backup only
    key: false
  - text: One — Wednesday's incremental contains everything
    key: false
  - text: Seven — every backup from the past week regardless of type
    key: false
  - text: Four — the Sunday full, then the Monday, Tuesday, and Wednesday incrementals in sequence
    key: true
explanation: >-
  Incrementals capture only changes since the LAST backup of any kind, so restoration requires the
  last full plus every subsequent incremental in order: Sunday full + Mon + Tue + Wed = 4 sets. (A)
  encodes the differential misconception — only a DIFFERENTIAL (changes since last full) would allow
  full + most recent only. (B) an incremental alone holds just one day's changes. (C) overshoots;
  backups before the Sunday full are superseded.
refs:
  - Full/incremental/differential backups
  - ISC U2-W4
