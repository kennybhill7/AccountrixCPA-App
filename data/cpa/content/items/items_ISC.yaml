id: ISC-MCQ-CYBR-0052
section: ISC
type: MCQ
difficulty: Hard
blueprint_area: Security, Confidentiality and Privacy
topic: Attack Types & Countermeasures
stem: >-
  During bid week, a builder's customer portal is knocked offline by massive automated traffic from
  thousands of compromised devices worldwide. Which attack is this, and which control set MOST
  directly mitigates it?
options:
  - text: SQL injection; fix with parameterized queries
    key: false
  - text: >-
      A distributed denial-of-service (DDoS) attack; mitigate with traffic-scrubbing/CDN services,
      rate limiting, and redundant capacity
    key: true
  - text: A brute-force password attack; mitigate with account lockouts
    key: false
  - text: An insider threat; mitigate with segregation of duties
    key: false
explanation: >-
  Coordinated flood traffic from a botnet aimed at exhausting availability is a DDoS; mitigation is
  absorbing/filtering volume — scrubbing services, CDNs, rate limiting, redundancy. (A) encodes the
  'all web attacks are injection' misconception; injection manipulates queries, it doesn't flood
  capacity, and parameterized queries do nothing against volume. (C) brute force targets
  credentials, and lockouts would not reduce network-level flooding. (D) nothing indicates an
  insider; SoD is a process control irrelevant to traffic floods.
refs:
  - DDoS; availability attacks
  - ISC U2-W3
