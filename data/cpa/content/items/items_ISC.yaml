id: ISC-MCQ-TSCR-0041
section: ISC
type: MCQ
difficulty: Medium
blueprint_area: Considerations for System and Organization Controls (SOC) Engagements
topic: Scoping TSC Categories
stem: >-
  A SaaS provider's customer contracts promise 99.9% uptime and financially credit customers for
  missed service levels. Its current SOC 2 covers security only. What should scoping recommend?
options:
  - text: Keep security only; uptime is a business matter outside SOC 2
    key: false
  - text: Replace security with availability, since only one category is allowed
    key: false
  - text: Add processing integrity, because uptime is about processing
    key: false
  - text: >-
      Add the availability category, because the company makes explicit availability commitments to
      customers
    key: true
explanation: >-
  Categories are added when the entity makes commitments or has system requirements in that domain —
  a contractual uptime SLA is the textbook trigger for including availability. (A) encodes the
  misconception that contractual commitments are out of scope; commitments are exactly what SOC 2
  examines. (B) is structurally wrong — security is always required and multiple categories can be
  combined. (C) misclassifies uptime: availability is about accessibility for operation, processing
  integrity about correctness of processing.
refs:
  - Scoping trust services categories
  - ISC U2-W2
