id: REG-MCQ-BUSI-0333
section: REG
type: MCQ
difficulty: Easy
blueprint_area: Business Law - Contracts
topic: Business Law - Contracts
learning_obj: Apply Business Law - Contracts concepts
stem: 'Party A offers to sell equipment for $25000. Party B responds: ''I accept,
  ship by by end of quarter.'' Is there a contract?'
options:
- text: Yes, acceptance with immaterial additional term under UCC
  key: true
- text: No, shipping term is material modification
  key: false
- text: No, mirror image rule violated
  key: false
- text: Yes, but only if Party A agrees to shipping date
  key: false
explanation: "UCC \xA72-207: Between merchants, additional terms become part of contract\
  \ unless material. Shipping date is typically not material."
refs:
- "UCC \xA72-207(2)"
- "UCC \xA72-206"
